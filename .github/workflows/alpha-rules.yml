name: alpha-rules
on:
  pull_request:
    paths:
      - 'ports/alpha-centauri/native/**'
      - '.github/workflows/alpha-rules.yml'
  push:
    branches: [main]
    paths:
      - 'ports/alpha-centauri/native/**'
      - '.github/workflows/alpha-rules.yml'
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross control tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-m68k-linux-gnu qemu-user
      - name: Host original owned worker-radius controls
        run: python3 ports/alpha-centauri/native/test_world_worker_radius.py --out "$RUNNER_TEMP/worker-radius-host"
      - name: Big-endian original owned worker-radius controls
        run: python3 ports/alpha-centauri/native/test_world_worker_radius.py --out "$RUNNER_TEMP/worker-radius-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host owned-world tile-yield binding controls
        run: python3 ports/alpha-centauri/native/test_world_tile_yields.py --out "$RUNNER_TEMP/world-tile-yields-host"
      - name: Big-endian owned-world tile-yield binding controls
        run: python3 ports/alpha-centauri/native/test_world_tile_yields.py --out "$RUNNER_TEMP/world-tile-yields-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host original fresh tile-yield controls
        run: python3 ports/alpha-centauri/native/test_tile_yields.py --out "$RUNNER_TEMP/tile-yields-host"
      - name: Big-endian original fresh tile-yield controls
