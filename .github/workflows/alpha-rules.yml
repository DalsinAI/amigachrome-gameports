name: alpha-rules
on:
  pull_request:
    paths:
      - 'ports/alpha-centauri/native/**'
      - '.github/workflows/alpha-rules.yml'
  push:
    branches: [main]
    paths:
      - 'ports/alpha-centauri/native/**'
      - '.github/workflows/alpha-rules.yml'
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross control tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-m68k-linux-gnu qemu-user
      - name: Host memory and undefined-behaviour controls
        run: python3 ports/alpha-centauri/native/test_rules.py --out "$RUNNER_TEMP/alpha-host"
      - name: Big-endian 68040 control
        run: python3 ports/alpha-centauri/native/test_rules.py --out "$RUNNER_TEMP/alpha-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host basic and world rules controls
        run: python3 ports/alpha-centauri/native/test_basic.py --out "$RUNNER_TEMP/basic-host"
      - name: Big-endian basic and world rules controls
        run: python3 ports/alpha-centauri/native/test_basic.py --out "$RUNNER_TEMP/basic-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host social and bonus-name controls
        run: python3 ports/alpha-centauri/native/test_social.py --out "$RUNNER_TEMP/social-host"
      - name: Big-endian social and bonus-name controls
        run: python3 ports/alpha-centauri/native/test_social.py --out "$RUNNER_TEMP/social-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host faction definition controls
        run: python3 ports/alpha-centauri/native/test_faction.py --out "$RUNNER_TEMP/faction-host"
      - name: Big-endian faction definition controls
        run: python3 ports/alpha-centauri/native/test_faction.py --out "$RUNNER_TEMP/faction-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host owned social and nutrient logic controls
        run: python3 ports/alpha-centauri/native/test_logic.py --out "$RUNNER_TEMP/logic-host"
      - name: Big-endian owned social and nutrient logic controls
        run: python3 ports/alpha-centauri/native/test_logic.py --out "$RUNNER_TEMP/logic-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host unit definition controls
        run: python3 ports/alpha-centauri/native/test_units.py --out "$RUNNER_TEMP/unit-host"
      - name: Big-endian unit definition controls
        run: python3 ports/alpha-centauri/native/test_units.py --out "$RUNNER_TEMP/unit-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host predefined prototype controls
        run: python3 ports/alpha-centauri/native/test_prototype.py --out "$RUNNER_TEMP/prototype-host"
      - name: Big-endian predefined prototype controls
        run: python3 ports/alpha-centauri/native/test_prototype.py --out "$RUNNER_TEMP/prototype-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host map geometry and movement pricing controls
        run: python3 ports/alpha-centauri/native/test_movement.py --out "$RUNNER_TEMP/movement-host"
      - name: Big-endian map geometry and movement pricing controls
        run: python3 ports/alpha-centauri/native/test_movement.py --out "$RUNNER_TEMP/movement-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host fractional movement expenditure controls
        run: python3 ports/alpha-centauri/native/test_move_budget.py --out "$RUNNER_TEMP/budget-host"
      - name: Big-endian fractional movement expenditure controls
        run: python3 ports/alpha-centauri/native/test_move_budget.py --out "$RUNNER_TEMP/budget-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host empty-land movement scenario controls
        run: python3 ports/alpha-centauri/native/test_exploration.py --out "$RUNNER_TEMP/exploration-host"
      - name: Big-endian empty-land movement scenario controls
        run: python3 ports/alpha-centauri/native/test_exploration.py --out "$RUNNER_TEMP/exploration-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host resource table controls
        run: python3 ports/alpha-centauri/native/test_resources.py --out "$RUNNER_TEMP/resources-host"
      - name: Big-endian resource table controls
        run: python3 ports/alpha-centauri/native/test_resources.py --out "$RUNNER_TEMP/resources-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host colony resource and population controls
        run: python3 ports/alpha-centauri/native/test_colony.py --out "$RUNNER_TEMP/colony-host"
      - name: Big-endian colony resource and population controls
        run: python3 ports/alpha-centauri/native/test_colony.py --out "$RUNNER_TEMP/colony-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host multi-turn colony scenario controls
        run: python3 ports/alpha-centauri/native/test_colony_scenario.py --out "$RUNNER_TEMP/colony-scenario-host"
      - name: Big-endian multi-turn colony scenario controls
        run: python3 ports/alpha-centauri/native/test_colony_scenario.py --out "$RUNNER_TEMP/colony-scenario-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host original map format controls
        run: python3 ports/alpha-centauri/native/test_original_map.py --out "$RUNNER_TEMP/original-map-host"
      - name: Big-endian original map format controls
        run: python3 ports/alpha-centauri/native/test_original_map.py --out "$RUNNER_TEMP/original-map-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host original scenario and save format controls
        run: python3 ports/alpha-centauri/native/test_original_game.py --out "$RUNNER_TEMP/original-game-host"
      - name: Big-endian original scenario and save format controls
        run: python3 ports/alpha-centauri/native/test_original_game.py --out "$RUNNER_TEMP/original-game-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host original saved faction state controls
        run: python3 ports/alpha-centauri/native/test_original_faction.py --out "$RUNNER_TEMP/original-faction-host"
      - name: Big-endian original saved faction state controls
        run: python3 ports/alpha-centauri/native/test_original_faction.py --out "$RUNNER_TEMP/original-faction-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
