name: alpha-rules
on:
  pull_request:
    paths:
      - 'ports/alpha-centauri/native/**'
      - '.github/workflows/alpha-rules.yml'
  push:
    branches: [main]
    paths:
      - 'ports/alpha-centauri/native/**'
      - '.github/workflows/alpha-rules.yml'
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross control tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-m68k-linux-gnu qemu-user
      - name: Host memory and undefined-behaviour controls
        run: python3 ports/alpha-centauri/native/test_rules.py --out "$RUNNER_TEMP/alpha-host"
      - name: Big-endian 68040 control
        run: python3 ports/alpha-centauri/native/test_rules.py --out "$RUNNER_TEMP/alpha-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host basic and world rules controls
        run: python3 ports/alpha-centauri/native/test_basic.py --out "$RUNNER_TEMP/basic-host"
      - name: Big-endian basic and world rules controls
        run: python3 ports/alpha-centauri/native/test_basic.py --out "$RUNNER_TEMP/basic-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host social and bonus-name controls
        run: python3 ports/alpha-centauri/native/test_social.py --out "$RUNNER_TEMP/social-host"
      - name: Big-endian social and bonus-name controls
        run: python3 ports/alpha-centauri/native/test_social.py --out "$RUNNER_TEMP/social-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host faction definition controls
        run: python3 ports/alpha-centauri/native/test_faction.py --out "$RUNNER_TEMP/faction-host"
      - name: Big-endian faction definition controls
        run: python3 ports/alpha-centauri/native/test_faction.py --out "$RUNNER_TEMP/faction-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host owned social and nutrient logic controls
        run: python3 ports/alpha-centauri/native/test_logic.py --out "$RUNNER_TEMP/logic-host"
      - name: Big-endian owned social and nutrient logic controls
        run: python3 ports/alpha-centauri/native/test_logic.py --out "$RUNNER_TEMP/logic-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host unit definition controls
        run: python3 ports/alpha-centauri/native/test_units.py --out "$RUNNER_TEMP/unit-host"
      - name: Big-endian unit definition controls
        run: python3 ports/alpha-centauri/native/test_units.py --out "$RUNNER_TEMP/unit-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
      - name: Host predefined prototype controls
        run: python3 ports/alpha-centauri/native/test_prototype.py --out "$RUNNER_TEMP/prototype-host"
      - name: Big-endian predefined prototype controls
        run: python3 ports/alpha-centauri/native/test_prototype.py --out "$RUNNER_TEMP/prototype-m68k" --cc m68k-linux-gnu-g++ --m68k-linux
