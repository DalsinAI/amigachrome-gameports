name: AstroMenace Clean Rebuild Instance 32

on:
  push:
    branches:
      - fix/astromenace-clean-rebuild-instance32-20261011
    paths:
      - ports/astromenace/**
      - scripts/build_astromenace_release.sh
      - scripts/game_port_prepare.py
      - scripts/validate_bmp_frame.py
      - toolchain/amigaos3-opengpu.cmake
      - .github/workflows/astromenace-clean-rebuild-instance32.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: astromenace-clean-rebuild-instance32
  cancel-in-progress: true

jobs:
  repair:
    name: Clean rebuild qualify and deploy AstroMenace 0011
    runs-on: self-hosted
    timeout-minutes: 75

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Preflight and preserve current DH1 evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = daletop
          APP="$HOME/AmigaChrome"
          LIVE_DH1="$HOME/AmigaChromeInstances/Instance-32/devices/harddisks/DH1"
          EVIDENCE="$PWD/build/astromenace-repair/evidence"
          mkdir -p "$EVIDENCE/current-install"
          test -x "$APP/scripts/lab_instance.py"
          test -d "$LIVE_DH1"
          test -x "$APP/stoves/os32-gcc16/prefix/bin/m68k-amigaos-gcc"

          {
            echo "host=$(hostname)"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "dh1=$LIVE_DH1"
            echo '--- AstroMenace top-level material ---'
            find "$LIVE_DH1" -maxdepth 1 -mindepth 1 \
              \( -iname 'AstroMenace*' -o -iname '.AstroMenace*' \) \
              -printf '%y %f %s bytes mode=%m\n' | sort
            echo '--- Installed tree ---'
            if test -d "$LIVE_DH1/AstroMenace"; then
              find "$LIVE_DH1/AstroMenace" -maxdepth 2 -printf '%y %P %s bytes mode=%m\n' | sort
            fi
          } | tee "$EVIDENCE/current-install/listing.txt"

          for name in BUILD-INFO.txt README-AmigaChrome.txt SHA256SUMS AstroMenace-run.log; do
            if test -f "$LIVE_DH1/AstroMenace/$name"; then
              cp -p "$LIVE_DH1/AstroMenace/$name" "$EVIDENCE/current-install/$name"
            fi
          done
          if test -f "$LIVE_DH1/AstroMenace/AstroMenace"; then
            file "$LIVE_DH1/AstroMenace/AstroMenace" \
              | tee "$EVIDENCE/current-install/executable-file.txt"
            sha256sum "$LIVE_DH1/AstroMenace/AstroMenace" \
              | tee "$EVIDENCE/current-install/executable-sha256.txt"
          fi
          if test -f "$LIVE_DH1/AstroMenace/gamedata.vfs"; then
            sha256sum "$LIVE_DH1/AstroMenace/gamedata.vfs" \
              | tee "$EVIDENCE/current-install/vfs-sha256.txt"
          fi

      - name: Reproduce the installed launch path in a disposable lab
        shell: bash
        run: |
          set -euo pipefail
          APP="$HOME/AmigaChrome"
          LAB_TOOL="$APP/scripts/lab_instance.py"
          LAB_ROOT="$HOME/AmigaChrome-dev/astromenace-runtime-labs"
          LAB="$LAB_ROOT/Instance-Astro-Old-${GITHUB_RUN_ID}"
          EVIDENCE="$PWD/build/astromenace-repair/evidence/current-launch"
          mkdir -p "$LAB_ROOT" "$EVIDENCE"

          python3 "$LAB_TOOL" copy Instance-32 "$LAB" --who ChatGPT
          cleanup() {
            python3 "$LAB_TOOL" stop "$LAB" >/dev/null 2>&1 || true
            rm -rf "$LAB"
          }
          trap cleanup EXIT

          TARGET="$LAB/devices/harddisks/DH1/AstroMenace"
          if ! test -s "$TARGET/AstroMenace"; then
            echo 'No installed AstroMenace executable was present to reproduce.' \
              | tee "$EVIDENCE/result.txt"
            cleanup
            trap - EXIT
            exit 0
          fi

          TEST_SCRIPT="$LAB/devices/harddisks/DH0/S/AstroMenace-Old-Launch"
          USER_STARTUP="$LAB/devices/harddisks/DH0/S/User-Startup"
          cat > "$TEST_SCRIPT" <<'AMIGA'
          FailAt 21
          Wait 5
          CD DH1:AstroMenace
          Echo "ASTRO-OLD: starting with normal Shell stack" >AstroMenace-old-run.log
          AstroMenace >>AstroMenace-old-run.log
          Echo "ASTRO-OLD: returned RC $RC" >>AstroMenace-old-run.log
          AMIGA
          touch "$USER_STARTUP"
          printf '\nRun >NIL: <NIL: Execute S:AstroMenace-Old-Launch\n' >> "$USER_STARTUP"

          python3 "$LAB_TOOL" start "$LAB" --who ChatGPT \
            --purpose "Reproduce installed AstroMenace launch ${GITHUB_RUN_ID}"

          result='no-main-menu'
          for attempt in $(seq 1 24); do
            if test -f "$TARGET/AstroMenace-old-run.log" && \
               grep -Fq 'AMDBG: main menu ready' "$TARGET/AstroMenace-old-run.log"; then
              result='main-menu-reached'
              break
            fi
            if test -f "$TARGET/AstroMenace-old-run.log" && \
               grep -Fq 'ASTRO-OLD: returned RC' "$TARGET/AstroMenace-old-run.log"; then
              result='returned-before-menu'
              break
            fi
            sleep 5
          done

          printf '%s\n' "$result" | tee "$EVIDENCE/result.txt"
          cp "$TARGET/AstroMenace-old-run.log" "$EVIDENCE/" 2>/dev/null || true
          cp "$LAB/logs/native-runtime.log" "$EVIDENCE/" 2>/dev/null || true
          cp "$LAB/state/current-screen.jpg" "$EVIDENCE/" 2>/dev/null || true
          if test -f "$EVIDENCE/AstroMenace-old-run.log"; then
            echo '--- old installed launch output ---'
            cat "$EVIDENCE/AstroMenace-old-run.log"
          fi

          cleanup
          trap - EXIT

      - name: Prepare two clean pinned source trees
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/game_port_prepare.py prepare --root "$PWD" --game astromenace --allow-network
          python3 scripts/game_port_prepare.py verify --root "$PWD" --game astromenace
          BASE="$PWD/build/game-ports/sources/astromenace"
          WORK="$PWD/build/astromenace-repair/sources"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp -a "$BASE" "$WORK/diagnostic"
          cp -a "$BASE" "$WORK/production"
          test -f "$WORK/diagnostic/CMakeLists.txt"
          test -f "$WORK/production/CMakeLists.txt"

      - name: Build launcher-qualified diagnostic package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PWD/build/astromenace-repair/diagnostic"
          STOVE="$HOME/AmigaChrome/stoves/os32-gcc16" \
          JOBS=4 \
          ASTROMENACE_DIAGNOSTICS=1 \
          ASTROMENACE_RELEASE_ID=0011 \
          sh ports/astromenace/build-amigaos3-runtime-fixed.sh \
            "$PWD/build/astromenace-repair/sources/diagnostic" \
            "$OUT"

          PKG="$OUT/package/AstroMenace"
          test -s "$PKG/AstroMenace"
          test -s "$PKG/AstroMenace.bin"
          test -s "$PKG/gamedata.vfs"
          file "$PKG/AstroMenace" "$PKG/AstroMenace.bin"
          strings "$PKG/AstroMenace" | grep -F 'PROGDIR:AstroMenace.bin'
          strings "$PKG/AstroMenace.bin" | grep -F 'AUTOTEST_FIRST_MISSION'
          strings "$PKG/AstroMenace.bin" | grep -F 'stage-shutdown-complete'
          (
            cd "$PKG"
            sha256sum -c SHA256SUMS
          )

      - name: Qualify launcher without a Shell Stack command
        shell: bash
        run: |
          set -euo pipefail
          APP="$HOME/AmigaChrome"
          LAB_TOOL="$APP/scripts/lab_instance.py"
          LAB_ROOT="$HOME/AmigaChrome-dev/astromenace-runtime-labs"
          LAB="$LAB_ROOT/Instance-Astro-Launcher-${GITHUB_RUN_ID}"
          EVIDENCE="$PWD/build/astromenace-repair/evidence/launcher-qualification"
          PKG="$PWD/build/astromenace-repair/diagnostic/package/AstroMenace"
          mkdir -p "$LAB_ROOT" "$EVIDENCE"

          python3 "$LAB_TOOL" copy Instance-32 "$LAB" --who ChatGPT
          cleanup() {
            python3 "$LAB_TOOL" stop "$LAB" >/dev/null 2>&1 || true
            rm -rf "$LAB"
          }
          trap cleanup EXIT

          TARGET="$LAB/devices/harddisks/DH1/AstroMenace-LAUNCHER-TEST"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp -a "$PKG/." "$TARGET/"
          : > "$TARGET/AUTOTEST_FIRST_MISSION"

          TEST_SCRIPT="$LAB/devices/harddisks/DH0/S/AstroMenace-Launcher-Test"
          USER_STARTUP="$LAB/devices/harddisks/DH0/S/User-Startup"
          cat > "$TEST_SCRIPT" <<'AMIGA'
          FailAt 21
          Wait 5
          CD DH1:AstroMenace-LAUNCHER-TEST
          Echo "ASTRO-LAUNCHER: starting with the normal Shell stack" >AstroMenace-run.log
          AstroMenace >>AstroMenace-run.log
          Echo "ASTRO-LAUNCHER: returned RC $RC" >>AstroMenace-run.log
          AMIGA
          touch "$USER_STARTUP"
          printf '\nRun >NIL: <NIL: Execute S:AstroMenace-Launcher-Test\n' >> "$USER_STARTUP"

          python3 "$LAB_TOOL" start "$LAB" --who ChatGPT \
            --purpose "AstroMenace launcher full qualification ${GITHUB_RUN_ID}"

          clean_exit=0
          for attempt in $(seq 1 72); do
            if test -f "$TARGET/stage-shutdown-complete" && \
               test -f "$TARGET/AstroMenace-run.log" && \
               grep -Fq 'ASTRO-LAUNCHER: returned RC 0' "$TARGET/AstroMenace-run.log"; then
              echo "Launcher-qualified AstroMenace completed after $((attempt * 5)) seconds."
              clean_exit=1
              sleep 2
              break
            fi
            if test -f "$TARGET/AstroMenace-run.log" && \
               grep -Fq 'ASTRO-LAUNCHER: returned RC' "$TARGET/AstroMenace-run.log" && \
               ! grep -Fq 'ASTRO-LAUNCHER: returned RC 0' "$TARGET/AstroMenace-run.log"; then
              echo "Launcher-qualified AstroMenace returned non-zero."
              break
            fi
            sleep 5
          done

          cp "$TARGET/AstroMenace-run.log" "$EVIDENCE/" 2>/dev/null || true
          cp "$TARGET/AstroMenace-first-frame.bmp" "$EVIDENCE/" 2>/dev/null || true
          cp "$TARGET/AstroMenace-workshop.bmp" "$EVIDENCE/" 2>/dev/null || true
          cp "$TARGET/AstroMenace-first-mission.bmp" "$EVIDENCE/" 2>/dev/null || true
          cp "$LAB/logs/native-runtime.log" "$EVIDENCE/" 2>/dev/null || true
          cp "$LAB/state/current-screen.jpg" "$EVIDENCE/" 2>/dev/null || true
          cp "$TARGET"/stage-* "$EVIDENCE/" 2>/dev/null || true
          find "$TARGET" -maxdepth 2 -type f -printf '%P %s bytes\n' | sort \
            > "$EVIDENCE/package-files.txt"
          sha256sum "$TARGET/AstroMenace" "$TARGET/AstroMenace.bin" \
            "$TARGET/gamedata.vfs" > "$EVIDENCE/runtime-package-sha256.txt"

          cleanup
          trap - EXIT

          echo '--- launcher qualification guest output ---'
          test -s "$EVIDENCE/AstroMenace-run.log"
          cat "$EVIDENCE/AstroMenace-run.log"
          grep -F 'AMDBG: entered main' "$EVIDENCE/AstroMenace-run.log"
          grep -F 'AMDBG: after VFS open' "$EVIDENCE/AstroMenace-run.log"
          grep -F 'AMDBG: window and GL context ready' "$EVIDENCE/AstroMenace-run.log"
          grep -F 'AMDBG: main menu ready' "$EVIDENCE/AstroMenace-run.log"
          grep -F 'ASTRO-LAUNCHER: returned RC 0' "$EVIDENCE/AstroMenace-run.log"
          test -f "$EVIDENCE/stage-first-game-frame-presented"
          test -f "$EVIDENCE/stage-audio-channel-active"
          test -f "$EVIDENCE/stage-keydown-received"
          test -f "$EVIDENCE/stage-keyup-received"
          test -f "$EVIDENCE/stage-shutdown-complete"
          test "$clean_exit" -eq 1

          python3 scripts/validate_bmp_frame.py \
            "$EVIDENCE/AstroMenace-first-frame.bmp" \
            | tee "$EVIDENCE/menu-frame-validation.json"
          python3 scripts/validate_bmp_frame.py \
            "$EVIDENCE/AstroMenace-workshop.bmp" \
            | tee "$EVIDENCE/workshop-frame-validation.json"
          python3 scripts/validate_bmp_frame.py \
            "$EVIDENCE/AstroMenace-first-mission.bmp" \
            | tee "$EVIDENCE/mission-frame-validation.json"

      - name: Build clean production release 0011
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PWD/build/astromenace-repair/release"
          STOVE="$HOME/AmigaChrome/stoves/os32-gcc16" \
          JOBS=4 \
          ASTROMENACE_RELEASE_ID=0011 \
          sh scripts/build_astromenace_release.sh \
            "$PWD" \
            "$PWD/build/astromenace-repair/sources/production" \
            "$OUT"

          PKG="$OUT/build/package/AstroMenace"
          test -s "$PKG/AstroMenace"
          test -s "$PKG/AstroMenace.bin"
          test -s "$PKG/gamedata.vfs"
          test -s "$OUT/AstroMenace-AC090-GCC16-0011.zip"
          (
            cd "$PKG"
            sha256sum -c SHA256SUMS
          )
          strings "$PKG/AstroMenace" | grep -F 'PROGDIR:AstroMenace.bin'
          strings "$PKG/AstroMenace.bin" | grep -F 'AMDBG: main menu ready'
          if strings "$PKG/AstroMenace.bin" | grep -Fq 'AUTOTEST_FIRST_MISSION'; then
            echo 'Production binary contains the qualification sentinel.' >&2
            exit 1
          fi

      - name: Smoke-test production package with the normal Shell stack
        shell: bash
        run: |
          set -euo pipefail
          APP="$HOME/AmigaChrome"
          LAB_TOOL="$APP/scripts/lab_instance.py"
          LAB_ROOT="$HOME/AmigaChrome-dev/astromenace-runtime-labs"
          LAB="$LAB_ROOT/Instance-Astro-Production-${GITHUB_RUN_ID}"
          EVIDENCE="$PWD/build/astromenace-repair/evidence/production-smoke"
          PKG="$PWD/build/astromenace-repair/release/build/package/AstroMenace"
          mkdir -p "$LAB_ROOT" "$EVIDENCE"

          python3 "$LAB_TOOL" copy Instance-32 "$LAB" --who ChatGPT
          cleanup() {
            python3 "$LAB_TOOL" stop "$LAB" >/dev/null 2>&1 || true
            rm -rf "$LAB"
          }
          trap cleanup EXIT

          TARGET="$LAB/devices/harddisks/DH1/AstroMenace-PRODUCTION-TEST"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp -a "$PKG/." "$TARGET/"

          TEST_SCRIPT="$LAB/devices/harddisks/DH0/S/AstroMenace-Production-Test"
          USER_STARTUP="$LAB/devices/harddisks/DH0/S/User-Startup"
          cat > "$TEST_SCRIPT" <<'AMIGA'
          FailAt 21
          Wait 5
          CD DH1:AstroMenace-PRODUCTION-TEST
          Echo "ASTRO-PRODUCTION: starting with the normal Shell stack" >AstroMenace-production.log
          AstroMenace >>AstroMenace-production.log
          Echo "ASTRO-PRODUCTION: returned RC $RC" >>AstroMenace-production.log
          AMIGA
          touch "$USER_STARTUP"
          printf '\nRun >NIL: <NIL: Execute S:AstroMenace-Production-Test\n' >> "$USER_STARTUP"

          python3 "$LAB_TOOL" start "$LAB" --who ChatGPT \
            --purpose "AstroMenace production launcher smoke ${GITHUB_RUN_ID}"

          reached=0
          for attempt in $(seq 1 48); do
            if test -f "$TARGET/AstroMenace-production.log" && \
               grep -Fq 'AMDBG: main menu ready' "$TARGET/AstroMenace-production.log"; then
              echo "Production package reached the main menu after $((attempt * 5)) seconds."
              reached=1
              sleep 5
              break
            fi
            if test -f "$TARGET/AstroMenace-production.log" && \
               grep -Fq 'ASTRO-PRODUCTION: returned RC' "$TARGET/AstroMenace-production.log"; then
              echo 'Production package returned before reaching the menu.'
              break
            fi
            sleep 5
          done

          cp "$TARGET/AstroMenace-production.log" "$EVIDENCE/" 2>/dev/null || true
          cp "$LAB/logs/native-runtime.log" "$EVIDENCE/" 2>/dev/null || true
          cp "$LAB/state/current-screen.jpg" "$EVIDENCE/" 2>/dev/null || true
          sha256sum "$TARGET/AstroMenace" "$TARGET/AstroMenace.bin" \
            "$TARGET/gamedata.vfs" > "$EVIDENCE/runtime-package-sha256.txt"

          cleanup
          trap - EXIT

          test -s "$EVIDENCE/AstroMenace-production.log"
          echo '--- production smoke guest output ---'
          cat "$EVIDENCE/AstroMenace-production.log"
          grep -F 'AMDBG: entered main' "$EVIDENCE/AstroMenace-production.log"
          grep -F 'AMDBG: after VFS open' "$EVIDENCE/AstroMenace-production.log"
          grep -F 'AMDBG: window and GL context ready' "$EVIDENCE/AstroMenace-production.log"
          grep -F 'AMDBG: after asset load' "$EVIDENCE/AstroMenace-production.log"
          grep -F 'AMDBG: main menu ready' "$EVIDENCE/AstroMenace-production.log"
          test "$reached" -eq 1

      - name: Remove old DH1 material and deploy the tested release
        shell: bash
        run: |
          set -euo pipefail
          LIVE_DH1="$HOME/AmigaChromeInstances/Instance-32/devices/harddisks/DH1"
          PKG="$PWD/build/astromenace-repair/release/build/package/AstroMenace"
          EVIDENCE="$PWD/build/astromenace-repair/evidence/deployment"
          INCOMING="$LIVE_DH1/.AstroMenace-0011.incoming-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE"

          echo '--- Removing old AstroMenace material from DH1 ---' \
            | tee "$EVIDENCE/cleanup.txt"
          find "$LIVE_DH1" -maxdepth 1 -mindepth 1 \
            \( -iname 'AstroMenace*' -o -iname '.AstroMenace*' \) \
            -print | sort | tee -a "$EVIDENCE/cleanup.txt"
          find "$LIVE_DH1" -maxdepth 1 -mindepth 1 \
            \( -iname 'AstroMenace*' -o -iname '.AstroMenace*' \) \
            -exec rm -rf -- {} +

          rm -rf "$INCOMING"
          cp -a "$PKG" "$INCOMING"
          (
            cd "$INCOMING"
            sha256sum -c SHA256SUMS
          )
          mv "$INCOMING" "$LIVE_DH1/AstroMenace"

          (
            cd "$LIVE_DH1/AstroMenace"
            sha256sum -c SHA256SUMS
          )
          cmp "$PKG/AstroMenace" "$LIVE_DH1/AstroMenace/AstroMenace"
          cmp "$PKG/AstroMenace.bin" "$LIVE_DH1/AstroMenace/AstroMenace.bin"
          cmp "$PKG/gamedata.vfs" "$LIVE_DH1/AstroMenace/gamedata.vfs"

          echo '--- Final DH1 AstroMenace material ---' \
            | tee "$EVIDENCE/final-listing.txt"
          find "$LIVE_DH1" -maxdepth 1 -mindepth 1 \
            \( -iname 'AstroMenace*' -o -iname '.AstroMenace*' \) \
            -printf '%y %f %s bytes mode=%m\n' | sort \
            | tee -a "$EVIDENCE/final-listing.txt"
          test "$(find "$LIVE_DH1" -maxdepth 1 -mindepth 1 -iname 'AstroMenace*' | wc -l)" -eq 1
          test -d "$LIVE_DH1/AstroMenace"
          test ! -e "$LIVE_DH1/AstroMenace-AC090-GCC16-0010.zip"
          file "$LIVE_DH1/AstroMenace/AstroMenace" \
               "$LIVE_DH1/AstroMenace/AstroMenace.bin" \
            | tee "$EVIDENCE/file-types.txt"
          find "$LIVE_DH1/AstroMenace" -maxdepth 2 -type f \
            -printf '%P %s bytes mode=%m\n' | sort \
            | tee "$EVIDENCE/installed-files.txt"
          sha256sum "$LIVE_DH1/AstroMenace/AstroMenace" \
                    "$LIVE_DH1/AstroMenace/AstroMenace.bin" \
                    "$LIVE_DH1/AstroMenace/gamedata.vfs" \
            | tee "$EVIDENCE/installed-sha256.txt"

      - name: Upload repaired release and all evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AstroMenace-AC090-GCC16-0011-Repair-${{ github.run_id }}
          path: |
            build/astromenace-repair/release/AstroMenace-AC090-GCC16-0011.zip
            build/astromenace-repair/release/SHA256SUMS
            build/astromenace-repair/release/RELEASE-MANIFEST.json
            build/astromenace-repair/evidence/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
