name: AstroMenace Clean Rebuild and Test

on:
  push:
    branches:
      - fix/astromenace-clean-rebuild-20261011
  workflow_dispatch:

concurrency:
  group: astromenace-clean-rebuild-instance32
  cancel-in-progress: true

jobs:
  rebuild-test-deploy:
    name: Rebuild, qualify and replace Instance-32 AstroMenace
    runs-on: self-hosted
    timeout-minutes: 35

    steps:
      - name: Checkout clean-rebuild branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify daletop toolchain and Instance-32
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = daletop
          STOVE="$HOME/AmigaChrome/stoves/os32-gcc16"
          test -x "$STOVE/prefix/bin/m68k-amigaos-gcc"
          test -x "$STOVE/prefix/bin/m68k-amigaos-g++"
          test -x "$STOVE/prefix/bin/sdl2-config"
          test -x "$HOME/AmigaChrome/scripts/lab_instance.py"
          test -d "$HOME/AmigaChromeInstances/Instance-32/devices/harddisks/DH1"
          "$STOVE/prefix/bin/m68k-amigaos-gcc" --version | head -1
          "$STOVE/prefix/bin/sdl2-config" --version

      - name: Inventory existing DH1 AstroMenace material
        shell: bash
        run: |
          set -euo pipefail
          DH1="$HOME/AmigaChromeInstances/Instance-32/devices/harddisks/DH1"
          EVIDENCE="$PWD/build/os3/astromenace-clean-rebuild/evidence"
          mkdir -p "$EVIDENCE"
          python3 - "$DH1" "$EVIDENCE/dh1-before.txt" <<'PY'
          from pathlib import Path
          import hashlib, sys

          root = Path(sys.argv[1])
          out = Path(sys.argv[2])
          lines = []
          for child in sorted(root.iterdir(), key=lambda p: p.name.lower()):
              key = ''.join(c for c in child.name.lower() if c.isalnum())
              if not key.startswith('astromenace'):
                  continue
              kind = 'dir' if child.is_dir() else 'file'
              lines.append(f'{child.name}\t{kind}')
              if child.is_file():
                  h = hashlib.sha256(child.read_bytes()).hexdigest()
                  lines.append(f'  sha256 {h} {child.stat().st_size} bytes')
              elif child.is_dir():
                  for rel in ('AstroMenace', 'gamedata.vfs', 'AstroMenace-run.log',
                              'AstroMenace-production.log', 'SHA256SUMS'):
                      p = child / rel
                      if p.is_file():
                          h = hashlib.sha256(p.read_bytes()).hexdigest()
                          lines.append(f'  {rel}\t{p.stat().st_size}\t{h}')
          if not lines:
              lines.append('(no existing AstroMenace material)')
          out.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(out.read_text(), end='')
          PY

      - name: Prepare two pristine AstroMenace source trees
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/game-ports/sources/astromenace \
                 build/game-ports/sources/astromenace-production \
                 build/game-ports/sources/astromenace-diagnostic
          python3 scripts/game_port_prepare.py prepare --root "$PWD" --game astromenace --allow-network
          python3 scripts/game_port_prepare.py verify --root "$PWD" --game astromenace
          cp -a build/game-ports/sources/astromenace \
                build/game-ports/sources/astromenace-production
          cp -a build/game-ports/sources/astromenace \
                build/game-ports/sources/astromenace-diagnostic

      - name: Build production AC090 GCC16 0011
        shell: bash
        run: |
          set -euo pipefail
          STOVE="$HOME/AmigaChrome/stoves/os32-gcc16" \
          JOBS=4 \
          ASTROMENACE_RELEASE_ID=0011 \
          ASTROMENACE_DIAGNOSTICS=0 \
          sh ports/astromenace/build-amigaos3-runtime-fixed.sh \
            build/game-ports/sources/astromenace-production \
            build/os3/astromenace-clean-rebuild/production

      - name: Build diagnostic AC090 GCC16 0011
        shell: bash
        run: |
          set -euo pipefail
          STOVE="$HOME/AmigaChrome/stoves/os32-gcc16" \
          JOBS=4 \
          ASTROMENACE_RELEASE_ID=0011 \
          ASTROMENACE_DIAGNOSTICS=1 \
          sh ports/astromenace/build-amigaos3-runtime-fixed.sh \
            build/game-ports/sources/astromenace-diagnostic \
            build/os3/astromenace-clean-rebuild/diagnostic

      - name: Verify clean packages and self-stack startup
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/os3/astromenace-clean-rebuild
          PROD="$ROOT/production/package/AstroMenace"
          DIAG="$ROOT/diagnostic/package/AstroMenace"
          NM="$HOME/AmigaChrome/stoves/os32-gcc16/prefix/bin/m68k-amigaos-nm"

          test -x "$PROD/AstroMenace"
          test -x "$DIAG/AstroMenace"
          test -s "$PROD/gamedata.vfs"
          test -s "$DIAG/gamedata.vfs"
          cmp "$PROD/gamedata.vfs" "$DIAG/gamedata.vfs"
          grep -F 'Startup stack: private 1 MiB' "$PROD/BUILD-INFO.txt"
          "$NM" -C "$PROD/AstroMenace" | grep -F 'AMRunMainWithStack'
          "$NM" -C "$PROD/AstroMenace" | grep -F 'AstroMenaceBody'
          strings "$PROD/AstroMenace" | grep -F 'AMDBG: '
          if strings "$PROD/AstroMenace" | grep -Fq 'stage-first-game-frame-presented'; then
            echo 'production binary unexpectedly contains qualification probes' >&2
            exit 1
          fi
          strings "$DIAG/AstroMenace" | grep -F 'stage-first-game-frame-presented'
          strings "$DIAG/AstroMenace" | grep -F 'stage-shutdown-complete'
          sha256sum \
            "$PROD/AstroMenace" "$PROD/gamedata.vfs" \
            "$DIAG/AstroMenace" "$DIAG/gamedata.vfs" \
            | tee "$ROOT/evidence/fresh-build-sha256.txt"

      - name: Qualify diagnostic journey from a default small-stack Shell
        shell: bash
        run: |
          set -euo pipefail
          APP="$HOME/AmigaChrome"
          LAB_ROOT="$HOME/AmigaChrome-dev/astromenace-clean-labs"
          LAB="$LAB_ROOT/Instance-Astro-Diag-${GITHUB_RUN_ID}"
          LAB_TOOL="$APP/scripts/lab_instance.py"
          ROOT="$PWD/build/os3/astromenace-clean-rebuild"
          EVIDENCE="$ROOT/evidence/diagnostic"
          PKG="$ROOT/diagnostic/package/AstroMenace"

          mkdir -p "$LAB_ROOT" "$EVIDENCE"
          python3 "$LAB_TOOL" copy Instance-32 "$LAB" --who ChatGPT
          cleanup() { python3 "$LAB_TOOL" stop "$LAB" || true; }
          trap cleanup EXIT

          TARGET="$LAB/devices/harddisks/DH1/AstroMenace-DIAG"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp -a "$PKG/." "$TARGET/"
          chmod 755 "$TARGET/AstroMenace"
          : > "$TARGET/AUTOTEST_FIRST_MISSION"

          TEST_SCRIPT="$LAB/devices/harddisks/DH0/S/AstroMenace-AutoTest"
          USER_STARTUP="$LAB/devices/harddisks/DH0/S/User-Startup"
          mkdir -p "$(dirname "$TEST_SCRIPT")"
          cat > "$TEST_SCRIPT" <<'AMIGA'
          FailAt 21
          Wait 5
          CD DH1:AstroMenace-DIAG
          Echo "ASTROTEST: starting without a Stack command" >AstroMenace-run.log
          AstroMenace >>AstroMenace-run.log
          Echo "ASTROTEST: returned RC $RC" >>AstroMenace-run.log
          AMIGA
          touch "$USER_STARTUP"
          printf '\nRun >NIL: <NIL: Execute S:AstroMenace-AutoTest\n' >> "$USER_STARTUP"

          python3 "$LAB_TOOL" start "$LAB" --who ChatGPT \
            --purpose "AstroMenace 0011 default-stack full journey ${GITHUB_RUN_ID}"

          clean_exit=0
          for attempt in $(seq 1 72); do
            if test -f "$TARGET/stage-shutdown-complete" && \
               test -f "$TARGET/AstroMenace-run.log" && \
               grep -Fq 'ASTROTEST: returned RC 0' "$TARGET/AstroMenace-run.log"; then
              clean_exit=1
              echo "Diagnostic completed from the unmodified small-stack launch after $((attempt * 5)) seconds."
              sleep 2
              break
            fi
            if test -f "$TARGET/AstroMenace-run.log" && \
               grep -Fq 'ASTROTEST: returned RC' "$TARGET/AstroMenace-run.log" && \
               ! grep -Fq 'ASTROTEST: returned RC 0' "$TARGET/AstroMenace-run.log"; then
              echo 'Diagnostic returned a non-zero code.'
              break
            fi
            sleep 5
          done

          cp "$TARGET/AstroMenace-run.log" "$EVIDENCE/" 2>/dev/null || true
          cp "$TARGET/AstroMenace-first-frame.bmp" "$EVIDENCE/" 2>/dev/null || true
          cp "$TARGET/AstroMenace-workshop.bmp" "$EVIDENCE/" 2>/dev/null || true
          cp "$TARGET/AstroMenace-first-mission.bmp" "$EVIDENCE/" 2>/dev/null || true
          cp "$LAB/logs/native-runtime.log" "$EVIDENCE/" 2>/dev/null || true
          cp "$LAB/state/current-screen.jpg" "$EVIDENCE/" 2>/dev/null || true
          cp "$TARGET"/stage-* "$EVIDENCE/" 2>/dev/null || true

          cleanup
          trap - EXIT

          test "$clean_exit" -eq 1
          test -s "$EVIDENCE/AstroMenace-run.log"
          grep -F 'ASTROTEST: starting without a Stack command' "$EVIDENCE/AstroMenace-run.log"
          grep -F 'AMDBG: entered main' "$EVIDENCE/AstroMenace-run.log"
          grep -F 'AMDBG: after VFS open' "$EVIDENCE/AstroMenace-run.log"
          grep -F 'AMDBG: window and GL context ready' "$EVIDENCE/AstroMenace-run.log"
          grep -F 'AMDBG: main menu ready' "$EVIDENCE/AstroMenace-run.log"
          grep -F 'ASTROTEST: returned RC 0' "$EVIDENCE/AstroMenace-run.log"
          test -f "$EVIDENCE/stage-first-frame-presented"
          test -f "$EVIDENCE/stage-workshop-frame-presented"
          test -f "$EVIDENCE/stage-first-game-frame-presented"
          test -f "$EVIDENCE/stage-audio-channel-active"
          test -f "$EVIDENCE/stage-keydown-received"
          test -f "$EVIDENCE/stage-keyup-received"
          test -f "$EVIDENCE/stage-shutdown-complete"
          test -s "$EVIDENCE/AstroMenace-first-frame.bmp"
          test -s "$EVIDENCE/AstroMenace-workshop.bmp"
          test -s "$EVIDENCE/AstroMenace-first-mission.bmp"
          python3 scripts/validate_bmp_frame.py "$EVIDENCE/AstroMenace-first-frame.bmp" \
            | tee "$EVIDENCE/menu-frame-validation.json"
          python3 scripts/validate_bmp_frame.py "$EVIDENCE/AstroMenace-workshop.bmp" \
            | tee "$EVIDENCE/workshop-frame-validation.json"
          python3 scripts/validate_bmp_frame.py "$EVIDENCE/AstroMenace-first-mission.bmp" \
            | tee "$EVIDENCE/mission-frame-validation.json"
          sha256sum "$EVIDENCE"/*.bmp | tee "$EVIDENCE/frame-sha256.txt"

      - name: Remove old DH1 copies and install fresh production package
        shell: bash
        run: |
          set -euo pipefail
          DH1="$HOME/AmigaChromeInstances/Instance-32/devices/harddisks/DH1"
          ROOT="$PWD/build/os3/astromenace-clean-rebuild"
          PKG="$ROOT/production/package/AstroMenace"
          EVIDENCE="$ROOT/evidence"
          TMP="$DH1/.AstroMenace-0011-incoming-${GITHUB_RUN_ID}"

          python3 - "$DH1" "$EVIDENCE/dh1-removed.txt" <<'PY'
          from pathlib import Path
          import shutil, sys

          root = Path(sys.argv[1])
          out = Path(sys.argv[2])
          removed = []
          for child in sorted(root.iterdir(), key=lambda p: p.name.lower()):
              key = ''.join(c for c in child.name.lower() if c.isalnum())
              if not key.startswith('astromenace'):
                  continue
              removed.append(child.name)
              if child.is_dir() and not child.is_symlink():
                  shutil.rmtree(child)
              else:
                  child.unlink()
          out.write_text('\n'.join(removed or ['(nothing removed)']) + '\n', encoding='utf-8')
          print(out.read_text(), end='')
          PY

          rm -rf "$TMP"
          mkdir -p "$TMP"
          cp -a "$PKG/." "$TMP/"
          chmod 755 "$TMP/AstroMenace"
          test -s "$TMP/AstroMenace"
          test -s "$TMP/gamedata.vfs"
          mv "$TMP" "$DH1/AstroMenace"

          (
            cd "$DH1/AstroMenace"
            sha256sum -c SHA256SUMS
          )
          cmp "$PKG/AstroMenace" "$DH1/AstroMenace/AstroMenace"
          cmp "$PKG/gamedata.vfs" "$DH1/AstroMenace/gamedata.vfs"

      - name: Smoke-test exact installed production copy without Stack command
        shell: bash
        run: |
          set -euo pipefail
          APP="$HOME/AmigaChrome"
          LAB_ROOT="$HOME/AmigaChrome-dev/astromenace-clean-labs"
          LAB="$LAB_ROOT/Instance-Astro-Prod-${GITHUB_RUN_ID}"
          LAB_TOOL="$APP/scripts/lab_instance.py"
          ROOT="$PWD/build/os3/astromenace-clean-rebuild"
          EVIDENCE="$ROOT/evidence/production"

          mkdir -p "$LAB_ROOT" "$EVIDENCE"
          python3 "$LAB_TOOL" copy Instance-32 "$LAB" --who ChatGPT
          cleanup() { python3 "$LAB_TOOL" stop "$LAB" || true; }
          trap cleanup EXIT

          TARGET="$LAB/devices/harddisks/DH1/AstroMenace"
          TEST_SCRIPT="$LAB/devices/harddisks/DH0/S/AstroMenace-ProductionTest"
          USER_STARTUP="$LAB/devices/harddisks/DH0/S/User-Startup"
          test -x "$TARGET/AstroMenace"
          rm -f "$TARGET/AstroMenace-production.log"
          rm -rf "$TARGET/User"
          mkdir -p "$(dirname "$TEST_SCRIPT")"
          cat > "$TEST_SCRIPT" <<'AMIGA'
          FailAt 21
          Wait 5
          CD DH1:AstroMenace
          Echo "ASTROPROD: starting exact installed copy without a Stack command" >AstroMenace-production.log
          AstroMenace >>AstroMenace-production.log
          Echo "ASTROPROD: returned RC $RC" >>AstroMenace-production.log
          AMIGA
          touch "$USER_STARTUP"
          printf '\nRun >NIL: <NIL: Execute S:AstroMenace-ProductionTest\n' >> "$USER_STARTUP"

          python3 "$LAB_TOOL" start "$LAB" --who ChatGPT \
            --purpose "AstroMenace 0011 installed production smoke ${GITHUB_RUN_ID}"

          menu_ready=0
          for attempt in $(seq 1 60); do
            if test -f "$TARGET/AstroMenace-production.log" && \
               grep -Fq 'AMDBG: main menu ready' "$TARGET/AstroMenace-production.log"; then
              menu_ready=1
              echo "Production copy reached the main menu after $((attempt * 5)) seconds."
              sleep 5
              break
            fi
            if test -f "$TARGET/AstroMenace-production.log" && \
               grep -Fq 'ASTROPROD: returned RC' "$TARGET/AstroMenace-production.log"; then
              echo 'Production copy returned before reaching the menu.'
              break
            fi
            sleep 5
          done

          cp "$TARGET/AstroMenace-production.log" "$EVIDENCE/" 2>/dev/null || true
          cp "$LAB/logs/native-runtime.log" "$EVIDENCE/" 2>/dev/null || true
          cp "$LAB/state/current-screen.jpg" "$EVIDENCE/" 2>/dev/null || true
          sha256sum "$TARGET/AstroMenace" "$TARGET/gamedata.vfs" \
            > "$EVIDENCE/installed-sha256.txt"

          cleanup
          trap - EXIT

          test "$menu_ready" -eq 1
          test -s "$EVIDENCE/AstroMenace-production.log"
          grep -F 'ASTROPROD: starting exact installed copy without a Stack command' \
            "$EVIDENCE/AstroMenace-production.log"
          grep -F 'AMDBG: entered main' "$EVIDENCE/AstroMenace-production.log"
          grep -F 'AMDBG: after VFS open' "$EVIDENCE/AstroMenace-production.log"
          grep -F 'AMDBG: window and GL context ready' "$EVIDENCE/AstroMenace-production.log"
          grep -F 'AMDBG: after asset load' "$EVIDENCE/AstroMenace-production.log"
          grep -F 'AMDBG: main menu ready' "$EVIDENCE/AstroMenace-production.log"
          if grep -Fq 'ASTROPROD: returned RC' "$EVIDENCE/AstroMenace-production.log"; then
            echo 'Production process exited unexpectedly during the smoke window.' >&2
            exit 1
          fi

      - name: Final DH1 audit and package release archive
        shell: bash
        run: |
          set -euo pipefail
          DH1="$HOME/AmigaChromeInstances/Instance-32/devices/harddisks/DH1"
          ROOT="$PWD/build/os3/astromenace-clean-rebuild"
          EVIDENCE="$ROOT/evidence"
          INSTALL="$DH1/AstroMenace"

          python3 - "$DH1" "$EVIDENCE/dh1-after.txt" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          out = Path(sys.argv[2])
          lines = []
          for child in sorted(root.iterdir(), key=lambda p: p.name.lower()):
              key = ''.join(c for c in child.name.lower() if c.isalnum())
              if key.startswith('astromenace'):
                  lines.append(f'{child.name}\t{"dir" if child.is_dir() else "file"}')
          out.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(out.read_text(), end='')
          PY
          test "$(wc -l < "$EVIDENCE/dh1-after.txt")" -eq 1
          grep -Fx $'AstroMenace\tdir' "$EVIDENCE/dh1-after.txt"
          test ! -e "$DH1/AstroMenace-DIAG"
          test ! -e "$DH1/AstroMenace-AC090-GCC16-0010.zip"
          test -x "$INSTALL/AstroMenace"
          test -s "$INSTALL/gamedata.vfs"
          grep -F 'Release: AC090 GCC16 0011' "$INSTALL/README-AmigaChrome.txt"
          grep -F 'No preceding Stack command is required' "$INSTALL/README-AmigaChrome.txt"

          (
            cd "$ROOT/production/package"
            zip -qr ../../AstroMenace-AC090-GCC16-0011.zip AstroMenace
          )
          sha256sum "$ROOT/AstroMenace-AC090-GCC16-0011.zip" \
            | tee "$ROOT/AstroMenace-AC090-GCC16-0011.zip.sha256"

      - name: Upload rebuilt package and qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AstroMenace-AC090-GCC16-0011-${{ github.run_id }}
          path: |
            build/os3/astromenace-clean-rebuild/AstroMenace-AC090-GCC16-0011.zip
            build/os3/astromenace-clean-rebuild/AstroMenace-AC090-GCC16-0011.zip.sha256
            build/os3/astromenace-clean-rebuild/evidence/
          if-no-files-found: warn
          retention-days: 90
