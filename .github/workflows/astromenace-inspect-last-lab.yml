name: AstroMenace Inspect Last Lab

on:
  push:
    branches:
      - fix/astromenace-runtime-diagnostics-20261009
  workflow_dispatch:

jobs:
  inspect:
    name: Inspect AstroMenace VFS failure
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect stopped lab
        shell: bash
        run: |
          set -euo pipefail
          LAB="$HOME/AmigaChrome-dev/astromenace-runtime-labs/Instance-Astro-38080886434"
          TARGET="$LAB/devices/harddisks/DH1/AstroMenace-DIAG"
          test -d "$TARGET"
          echo '--- package files ---'
          find "$TARGET" -maxdepth 3 -type f -printf '%P %s bytes\n' | sort | head -200
          echo '--- guest output ---'
          cat "$TARGET/AstroMenace-run.log" || true
          echo '--- VFS files ---'
          ls -l "$TARGET/gamedata.vfs" "$TARGET/gamedata/models/models.pack" 2>/dev/null || true
          echo '--- headers ---'
          for f in "$TARGET/gamedata.vfs" "$TARGET/gamedata/models/models.pack"; do
            if test -f "$f"; then
              echo "$f"
              od -An -tx1 -N64 "$f"
            fi
          done
          python3 - "$TARGET" <<'PY'
          from pathlib import Path
          import struct, sys
          root = Path(sys.argv[1])
          for rel in ('gamedata.vfs', 'gamedata/models/models.pack'):
              p = root / rel
              if not p.exists():
                  print(rel, 'MISSING')
                  continue
              b = p.read_bytes()[:32]
              print(rel, 'size', p.stat().st_size, 'header', b[:16])
              if len(b) >= 16:
                  print(' little:', struct.unpack('<4s4sII', b[:16]))
                  print(' big:   ', struct.unpack('>4s4sII', b[:16]))
          PY
          echo '--- native runtime tail ---'
          tail -200 "$LAB/logs/native-runtime.log" 2>/dev/null || true

      - name: Upload lab evidence
        uses: actions/upload-artifact@v4
        with:
          name: AstroMenace-last-lab-evidence-${{ github.run_id }}
          path: |
            /home/da1ek/AmigaChrome-dev/astromenace-runtime-labs/Instance-Astro-38080886434/devices/harddisks/DH1/AstroMenace-DIAG/AstroMenace-run.log
            /home/da1ek/AmigaChrome-dev/astromenace-runtime-labs/Instance-Astro-38080886434/devices/harddisks/DH1/AstroMenace-DIAG/gamedata.vfs
            /home/da1ek/AmigaChrome-dev/astromenace-runtime-labs/Instance-Astro-38080886434/state/current-screen.jpg
            /home/da1ek/AmigaChrome-dev/astromenace-runtime-labs/Instance-Astro-38080886434/logs/native-runtime.log
          if-no-files-found: warn
          retention-days: 14
