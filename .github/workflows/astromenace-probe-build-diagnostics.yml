name: AstroMenace Probe Build Diagnostics

on:
  push:
    branches:
      - debug/astromenace-mixclose-probe-20261011
  workflow_dispatch:

concurrency:
  group: astromenace-probe-build-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    name: Capture exact SDL probe build failure
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Prepare, patch and rebuild one stage at a time
        shell: bash
        run: |
          set -u
          ROOT="$PWD/build/probe-build-diagnostics"
          OGPU="$ROOT/openamigartg"
          OUT="$ROOT/out"
          WORK="$OUT/sdl2-work"
          LOG="$ROOT/logs"
          mkdir -p "$LOG"
          rm -rf "$OGPU" "$OUT"

          run_phase() {
            name=$1
            shift
            echo "===== $name =====" | tee "$LOG/$name.log"
            set +e
            "$@" >>"$LOG/$name.log" 2>&1
            rc=$?
            set -e
            echo "RC=$rc" | tee -a "$LOG/$name.log"
            return $rc
          }

          set -e
          run_phase clone git clone --depth 1 https://github.com/DalsinAI/openamigartg.git "$OGPU" || exit 10
          git -C "$OGPU" rev-parse HEAD | tee "$LOG/openamigartg-head.txt"
          run_phase ahi_patch python3 ports/astromenace/patch_opengpu_sdl2_ahi_close.py "$OGPU" || exit 11

          # Build once to prepare every pinned source tree and establish a known-good baseline.
          set +e
          STOVE="$HOME/AmigaChrome/stoves/os32-gcc16/prefix" \
          SDK_HEADERS="$HOME/AmigaChrome/stoves/os32/prefix/m68k-amigaos/include" \
          "$OGPU/library/modules/sdl2/build.sh" "$OUT" module satellites \
            >"$LOG/baseline-build.log" 2>&1
          baseline_rc=$?
          set -e
          echo "RC=$baseline_rc" >> "$LOG/baseline-build.log"

          {
            echo "baseline_rc=$baseline_rc"
            echo "WORK=$WORK"
            find "$WORK" -maxdepth 3 -type d -printf '%P\n' 2>/dev/null | sort | head -300
            echo '--- candidate files ---'
            find "$WORK" -type f \( -name mixer.c -o -name SDL_audio.c -o -name SDL_os3audio.c \) -printf '%P\n' 2>/dev/null | sort
            echo '--- candidate objects ---'
            find "$WORK" -type f \( -name mixer.o -o -name SDL_audio.o -o -name SDL_os3audio.o \) -printf '%P\n' 2>/dev/null | sort
          } > "$LOG/tree.txt"

          test -f "$WORK/SDL2-2.32.10/src/audio/amigaos3/SDL_os3audio.c" || exit 20
          test -f "$WORK/SDL2-2.32.10/src/audio/SDL_audio.c" || exit 21
          test -f "$WORK/SDL2_mixer-2.8.2/src/mixer.c" || exit 22

          AHI="$WORK/SDL2-2.32.10/src/audio/amigaos3/SDL_os3audio.c"
          CORE="$WORK/SDL2-2.32.10/src/audio/SDL_audio.c"
          grep -q 'SDL_rwops.h' "$AHI" || sed -i '/#include "SDL_timer.h"/a #include "SDL_rwops.h"' "$AHI"
          grep -q 'SDL_rwops.h' "$CORE" || sed -i '/#include "SDL_audio_c.h"/a #include "SDL_rwops.h"' "$CORE"

          set +e
          python3 ports/astromenace/patch_mixclose_probe_modules.py "$OUT" \
            >"$LOG/instrument.log" 2>&1
          instrument_rc=$?
          set -e
          echo "RC=$instrument_rc" >> "$LOG/instrument.log"
          if [ "$instrument_rc" -ne 0 ]; then exit 30; fi

          find "$WORK" -type f \( -name mixer.o -o -name SDL_audio.o -o -name SDL_os3audio.o \) \
            -delete

          set +e
          make -f "$OGPU/library/modules/sdl2/Makefile" -j4 \
            SDL="$WORK/SDL2-2.32.10" OUT="$OUT" WORK="$WORK" \
            module >"$LOG/module-rebuild.log" 2>&1
          module_rc=$?
          set -e
          echo "RC=$module_rc" >> "$LOG/module-rebuild.log"

          set +e
          make -f "$OGPU/library/modules/sdl2/satellites/Makefile" -j4 \
            OUT="$OUT" WORK="$WORK" "$OUT/SDL2_mixer.module" \
            >"$LOG/mixer-rebuild.log" 2>&1
          mixer_rc=$?
          set -e
          echo "RC=$mixer_rc" >> "$LOG/mixer-rebuild.log"

          {
            echo "baseline_rc=$baseline_rc"
            echo "instrument_rc=$instrument_rc"
            echo "module_rc=$module_rc"
            echo "mixer_rc=$mixer_rc"
            ls -l "$OUT"/SDL2.module "$OUT"/SDL2_mixer.module 2>&1 || true
          } | tee "$LOG/result.txt"

          test "$module_rc" -eq 0
          test "$mixer_rc" -eq 0

      - name: Upload exact logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AstroMenace-Probe-Build-Diagnostics-${{ github.run_id }}
          path: build/probe-build-diagnostics/logs/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
