name: AstroMenace Runtime Diagnostic

on:
  push:
    branches:
      - fix/astromenace-runtime-diagnostics-20261009
  workflow_dispatch:

concurrency:
  group: astromenace-runtime-diagnostic
  cancel-in-progress: true

jobs:
  build:
    name: Build and run AstroMenace diagnostic
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Prepare AstroMenace source
        shell: bash
        run: |
          python3 scripts/game_port_prepare.py prepare --root "$PWD" --game astromenace --allow-network
          python3 scripts/game_port_prepare.py verify --root "$PWD" --game astromenace

      - name: Build corrected binary and VFS
        shell: bash
        run: |
          STOVE="$HOME/AmigaChrome/stoves/os32-gcc16" \
          JOBS=4 \
          sh ports/astromenace/build-amigaos3-runtime-fixed.sh \
            build/game-ports/sources/astromenace \
            build/os3/astromenace-runtime-diagnostic

      - name: Verify corrected package
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/os3/astromenace-runtime-diagnostic
          BIN="$OUT/astromenace"
          VFS="$OUT/package/AstroMenace/gamedata.vfs"
          OLD=debd8bed9823c7c1792f4f58467171ea0df8881045a8c122d56639361f6b2c1f
          NEW=$(sha256sum "$BIN" | awk '{print $1}')
          test "$NEW" != "$OLD"
          strings "$BIN" | grep -F 'AMDBG: '
          strings "$BIN" | grep -F 'random engine reseeded'
          strings "$BIN" | grep -F 'stage-first-frame-captured'
          strings "$BIN" | grep -F 'stage-first-frame-presented'
          test -s "$VFS"
          python3 - "$VFS" <<'PY'
          from pathlib import Path
          import struct, sys
          p = Path(sys.argv[1])
          b = p.read_bytes()
          sign, version, build, table = struct.unpack_from('<4s4sII', b, 0)
          assert sign == b'VFS_' and version == b'v1.6'
          assert build == 250208
          assert 16 < table < len(b)
          assert len(b) > 50_000_000
          print(f'VERIFIED_VFS size={len(b)} build={build} table={table}')
          PY
          printf 'ASTROMENACE_DIAGNOSTIC_BINARY=%s\n' "$NEW"
          sha256sum "$BIN" "$VFS"

      - name: Package corrected replacement
        shell: bash
        run: |
          cd build/os3/astromenace-runtime-diagnostic/package
          zip -qr ../AstroMenace-AC090-RUNTIME-DIAGNOSTIC.zip AstroMenace
          cd ..
          sha256sum AstroMenace-AC090-RUNTIME-DIAGNOSTIC.zip > SHA256SUMS

      - name: Render, capture and present the first menu frame in disposable Instance-32 lab
        shell: bash
        run: |
          set -euo pipefail
          APP="$HOME/AmigaChrome"
          LAB_ROOT="$HOME/AmigaChrome-dev/astromenace-runtime-labs"
          LAB="$LAB_ROOT/Instance-Astro-${GITHUB_RUN_ID}"
          EVIDENCE="$PWD/build/os3/astromenace-runtime-diagnostic/runtime-evidence"
          LAB_TOOL="$APP/scripts/lab_instance.py"

          mkdir -p "$LAB_ROOT" "$EVIDENCE"
          python3 "$LAB_TOOL" copy Instance-32 "$LAB" --who ChatGPT

          cleanup() {
            python3 "$LAB_TOOL" stop "$LAB" || true
          }
          trap cleanup EXIT

          TARGET="$LAB/devices/harddisks/DH1/AstroMenace-DIAG"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp -a build/os3/astromenace-runtime-diagnostic/package/AstroMenace/. "$TARGET/"

          TEST_SCRIPT="$LAB/devices/harddisks/DH0/S/AstroMenace-AutoTest"
          USER_STARTUP="$LAB/devices/harddisks/DH0/S/User-Startup"
          mkdir -p "$(dirname "$TEST_SCRIPT")"
          cat > "$TEST_SCRIPT" <<'AMIGA'
          FailAt 21
          Wait 5
          Stack 1000000
          CD DH1:AstroMenace-DIAG
          Echo "ASTROTEST: starting" >AstroMenace-run.log
          AstroMenace >>AstroMenace-run.log
          Echo "ASTROTEST: returned RC $RC" >>AstroMenace-run.log
          AMIGA
          touch "$USER_STARTUP"
          printf '\nRun >NIL: <NIL: Execute S:AstroMenace-AutoTest\n' >> "$USER_STARTUP"

          python3 "$LAB_TOOL" start "$LAB" --who ChatGPT --purpose "AstroMenace framebuffer qualification ${GITHUB_RUN_ID}"
          printf '%s\n' "$LAB" > "$EVIDENCE/LAB_PATH.txt"

          reached=0
          for attempt in $(seq 1 36); do
            if test -f "$TARGET/stage-first-frame-presented"; then
              echo "AstroMenace captured and presented its first menu frame after $((attempt * 5)) seconds."
              reached=1
              sleep 2
              break
            fi
            if test -f "$TARGET/AstroMenace-run.log" && \
               grep -Fq 'ASTROTEST: returned RC' "$TARGET/AstroMenace-run.log"; then
              echo "AstroMenace returned before its first frame after $((attempt * 5)) seconds."
              break
            fi
            sleep 5
          done

          cp "$TARGET/AstroMenace-run.log" "$EVIDENCE/" 2>/dev/null || true
          cp "$TARGET/AstroMenace-first-frame.bmp" "$EVIDENCE/" 2>/dev/null || true
          cp "$LAB/logs/native-runtime.log" "$EVIDENCE/" 2>/dev/null || true
          cp "$LAB/state/current-screen.jpg" "$EVIDENCE/" 2>/dev/null || true
          cp "$TARGET"/stage-* "$EVIDENCE/" 2>/dev/null || true
          find "$TARGET" -maxdepth 2 -type f -printf '%P %s bytes\n' | sort > "$EVIDENCE/package-files.txt"
          sha256sum "$TARGET/AstroMenace" "$TARGET/gamedata.vfs" > "$EVIDENCE/runtime-package-sha256.txt"

          cleanup
          trap - EXIT

          echo '--- AstroMenace guest output ---'
          test -s "$EVIDENCE/AstroMenace-run.log"
          cat "$EVIDENCE/AstroMenace-run.log"
          echo '--- AstroMenace stage files ---'
          find "$EVIDENCE" -maxdepth 1 -name 'stage-*' -printf '%f\n' | sort
          echo '--- AstroMenace captured framebuffer ---'
          file "$EVIDENCE/AstroMenace-first-frame.bmp"
          stat -c '%n %s bytes' "$EVIDENCE/AstroMenace-first-frame.bmp"

          grep -F 'AMDBG: after VFS open' "$EVIDENCE/AstroMenace-run.log"
          grep -F 'AMDBG: window and GL context ready' "$EVIDENCE/AstroMenace-run.log"
          test -f "$EVIDENCE/stage-after-asset-load"
          test -f "$EVIDENCE/stage-main-menu-ready"
          test -f "$EVIDENCE/stage-loop-enter"
          test -f "$EVIDENCE/stage-menu-drawn"
          test -f "$EVIDENCE/stage-first-frame-captured"
          test -f "$EVIDENCE/stage-first-frame-presented"
          test -s "$EVIDENCE/AstroMenace-first-frame.bmp"
          test "$(stat -c %s "$EVIDENCE/AstroMenace-first-frame.bmp")" -gt 100000
          test "$reached" -eq 1

      - name: Upload corrected package and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AstroMenace-AC090-RUNTIME-DIAGNOSTIC-${{ github.run_id }}
          path: |
            build/os3/astromenace-runtime-diagnostic/AstroMenace-AC090-RUNTIME-DIAGNOSTIC.zip
            build/os3/astromenace-runtime-diagnostic/SHA256SUMS
            build/os3/astromenace-runtime-diagnostic/runtime-evidence/
          if-no-files-found: warn
          retention-days: 30
