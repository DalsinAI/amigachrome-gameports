name: C-Dogs AC090 First Light

on:
  push:
    branches:
      - runtime/cdogs-firstlight-20261011
  workflow_dispatch:

concurrency:
  group: cdogs-ac090-firstlight
  cancel-in-progress: true

jobs:
  firstlight:
    name: Rebuild and run C-Dogs on a disposable Instance-32 clone
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout first-light branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Preflight daletop and clear stale labs
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = daletop
          APP="$HOME/AmigaChrome"
          LIVE="$HOME/AmigaChromeInstances/Instance-32"
          test -x "$APP/scripts/lab_instance.py"
          test -x "$APP/stoves/os32-gcc16/prefix/bin/m68k-amigaos-gcc"
          test -d "$LIVE/devices/harddisks/DH0"
          test -d "$LIVE/devices/harddisks/DH1"
          "$APP/stoves/os32-gcc16/prefix/bin/m68k-amigaos-gcc" --version | head -1
          "$APP/stoves/os32-gcc16/prefix/bin/sdl2-config" --version

          LAB_ROOT="$HOME/da1ek/AmigaChrome-dev/cdogs-firstlight-labs"
          LAB_ROOT="$HOME/AmigaChrome-dev/cdogs-firstlight-labs"
          mkdir -p "$LAB_ROOT"
          for lab in "$LAB_ROOT"/Instance-CDogs-*; do
            test -d "$lab" || continue
            timeout 20s python3 "$APP/scripts/lab_instance.py" stop "$lab" >/dev/null 2>&1 || true
            rm -rf "$lab"
          done

      - name: Prepare exact pinned source and rebuild with fixed GCC16 stove
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/build/cdogs-firstlight"
          SRC="$PWD/build/game-ports/sources/cdogs-sdl"
          OUT="$PWD/build/os3/cdogs-firstlight"
          rm -rf "$ROOT" "$SRC" "$OUT"
          mkdir -p "$ROOT/evidence"

          python3 scripts/game_port_prepare.py prepare \
            --root "$PWD" --game cdogs-sdl --allow-network
          python3 scripts/game_port_prepare.py verify \
            --root "$PWD" --game cdogs-sdl

          test "$(git -C "$SRC" rev-parse HEAD)" = \
            8263a6f0200a71498f8c47bd0fce0f2d2d678d84
          git -C "$SRC" rev-parse HEAD | tee "$ROOT/evidence/upstream-head.txt"

          BASE_PATCH="$PWD/ports/cdogs-sdl/patches/0001-amigaos3-opengpu.patch"
          if git -C "$SRC" apply --check "$BASE_PATCH" >/dev/null 2>&1; then
            git -C "$SRC" apply "$BASE_PATCH"
          fi
          python3 ports/cdogs-sdl/patch_runtime_diagnostics.py "$SRC"

          STOVE="$HOME/AmigaChrome/stoves/os32-gcc16" \
            sh ports/cdogs-sdl/build-amigaos3.sh "$SRC" "$OUT" \
            2>&1 | tee "$ROOT/evidence/build.log"

          EXE="$OUT/src/cdogs-sdl"
          test -x "$EXE"
          strings "$EXE" | grep -F 'stage-cdogs-00-pre-main'
          strings "$EXE" | grep -F 'stage-cdogs-09-loop-enter'
          strings "$EXE" | grep -F 'stage-cdogs-90-return-zero'
          file "$EXE" | tee "$ROOT/evidence/binary-type.txt"
          sha256sum "$EXE" | tee "$ROOT/evidence/binary-sha256.txt"

      - name: Assemble private engineering payload
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/build/cdogs-firstlight"
          SRC="$PWD/build/game-ports/sources/cdogs-sdl"
          EXE="$PWD/build/os3/cdogs-firstlight/src/cdogs-sdl"
          PKG="$ROOT/package/CDogs"
          rm -rf "$ROOT/package"
          mkdir -p "$PKG/Prefs"
          cp -p "$EXE" "$PKG/cdogs-sdl"
          chmod 755 "$PKG/cdogs-sdl"

          for item in data dogfights missions graphics music sounds; do
            test -e "$SRC/$item" || continue
            cp -a "$SRC/$item" "$PKG/$item"
          done

          cat > "$PKG/TEST-BUILD.txt" <<EOF
          C-Dogs SDL AC090 GCC16 fixed-stove first-light build
          Upstream: 8263a6f0200a71498f8c47bd0fce0f2d2d678d84
          This private engineering payload includes upstream data solely for
          disposable runtime qualification. Do not publish it until the mixed
          asset-provenance review is closed.
          Persistent stage-cdogs-* files identify the exact last guest stage.
          EOF

          test -d "$PKG/data"
          test -d "$PKG/graphics"
          du -sh "$PKG" | tee "$ROOT/evidence/private-payload-size.txt"
          find "$PKG" -type f | wc -l | tee "$ROOT/evidence/private-payload-file-count.txt"

      - name: Run isolated 30-second demo and prove fixed-stove runtime
        shell: bash
        run: |
          set -euo pipefail
          APP="$HOME/AmigaChrome"
          LAB_TOOL="$APP/scripts/lab_instance.py"
          ROOT="$PWD/build/cdogs-firstlight"
          PKG="$ROOT/package/CDogs"
          EVIDENCE="$ROOT/evidence/runtime"
          LAB_ROOT="$HOME/AmigaChrome-dev/cdogs-firstlight-labs"
          LAB="$LAB_ROOT/Instance-CDogs-${GITHUB_RUN_ID}"
          TARGET="$LAB/devices/harddisks/DH1/CDogs-FLIGHT"
          mkdir -p "$LAB_ROOT" "$EVIDENCE"
          rm -rf "$LAB"

          python3 "$LAB_TOOL" copy Instance-32 "$LAB" --who ChatGPT

          cleanup() {
            timeout 20s python3 "$LAB_TOOL" stop "$LAB" >/dev/null 2>&1 || true
            rm -rf "$LAB"
          }
          trap cleanup EXIT

          TEST_SCRIPT="$LAB/devices/harddisks/DH0/S/CDogs-FirstLight"
          USER_STARTUP="$LAB/devices/harddisks/DH0/S/User-Startup"
          mkdir -p "$(dirname "$TEST_SCRIPT")"
          touch "$USER_STARTUP"
          cp -p "$USER_STARTUP" "$EVIDENCE/User-Startup.before"

          python3 - "$USER_STARTUP" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="latin-1") if path.exists() else ""
          names = re.compile(
              r"AstroMenace|AssaultCube|CDogs|ChocolateDoom|SDL2[ -]?Demos|"
              r"OpenFire|OpenTunnel|OpenTriangles|OpenEffects|OpenRay|"
              r"OpenHypno|OpenIntro|OpenFloor|OpenSprites|OpenTarget|"
              r"OpenParticles|OpenBoids|OpenScope",
              re.IGNORECASE,
          )
          kept = [line for line in text.splitlines() if not names.search(line)]
          path.write_text("\n".join(kept).rstrip() + "\n", encoding="latin-1")
          PY
          cp -p "$USER_STARTUP" "$EVIDENCE/User-Startup.filtered"

          find "$LAB/devices/harddisks/DH0/S" -maxdepth 1 -type f \
            \( -iname 'AstroMenace*' -o -iname 'AssaultCube*' \
               -o -iname 'CDogs*' -o -iname 'ChocolateDoom*' \) \
            -delete

          mkdir -p "$TARGET"
          cp -a "$PKG/." "$TARGET/"
          chmod 755 "$TARGET/cdogs-sdl"

          cat > "$TEST_SCRIPT" <<'AMIGA'
          FailAt 21
          Wait 5
          CD DH1:CDogs-FLIGHT
          Echo "CDOGSTEST: starting fixed-stove demo" >CDogs-run.log
          cdogs-sdl --demo --screen=640x480 --log=debug --logfile=cdogs-runtime.log >>CDogs-run.log
          Echo "CDOGSTEST: returned RC $RC" >>CDogs-run.log
          AMIGA
          printf '\nRun >NIL: <NIL: Execute S:CDogs-FirstLight\n' >> "$USER_STARTUP"
          cp -p "$USER_STARTUP" "$EVIDENCE/User-Startup.final"

          python3 "$LAB_TOOL" start "$LAB" --who ChatGPT \
            --purpose "C-Dogs fixed-stove first light ${GITHUB_RUN_ID}"

          pre_main=0
          entered_main=0
          sdl_ready=0
          video_ready=0
          graphics_loaded=0
          audio_stage=0
          loop_enter=0
          loop_returned=0
          clean_exit=0
          error_exit=0
          for attempt in $(seq 1 36); do
            test -f "$TARGET/stage-cdogs-00-pre-main" && pre_main=1
            test -f "$TARGET/stage-cdogs-01-enter-main" && entered_main=1
            test -f "$TARGET/stage-cdogs-04-sdl-ready" && sdl_ready=1
            test -f "$TARGET/stage-cdogs-05-video-ready" && video_ready=1
            test -f "$TARGET/stage-cdogs-06-graphics-loaded" && graphics_loaded=1
            if test -f "$TARGET/stage-cdogs-07-audio-ready" || \
               test -f "$TARGET/stage-cdogs-07-audio-unavailable"; then
              audio_stage=1
            fi
            test -f "$TARGET/stage-cdogs-09-loop-enter" && loop_enter=1
            test -f "$TARGET/stage-cdogs-10-loop-returned" && loop_returned=1
            test -f "$TARGET/stage-cdogs-90-return-zero" && clean_exit=1
            test -f "$TARGET/stage-cdogs-99-return-error" && error_exit=1

            if test "$attempt" -eq 2 || test "$attempt" -eq 4 || \
               test "$attempt" -eq 8 || test "$attempt" -eq 12; then
              cp "$LAB/state/current-screen.jpg" \
                "$EVIDENCE/screen-$((attempt * 5))s.jpg" 2>/dev/null || true
            fi

            if test -f "$TARGET/CDogs-run.log" && \
               grep -Fq 'CDOGSTEST: returned RC 0' "$TARGET/CDogs-run.log"; then
              clean_exit=1
              cp "$LAB/state/current-screen.jpg" \
                "$EVIDENCE/screen-after-return.jpg" 2>/dev/null || true
              break
            fi
            if test "$error_exit" -eq 1; then
              echo "C-Dogs returned an error after $((attempt * 5)) seconds."
              break
            fi
            sleep 5
          done

          cp "$TARGET/CDogs-run.log" "$EVIDENCE/" 2>/dev/null || true
          cp "$TARGET/cdogs-runtime.log" "$EVIDENCE/" 2>/dev/null || true
          cp "$LAB/logs/native-runtime.log" "$EVIDENCE/" 2>/dev/null || true
          cp "$LAB/state/current-screen.jpg" "$EVIDENCE/screen-final.jpg" 2>/dev/null || true
          cp "$TARGET"/stage-cdogs-* "$EVIDENCE/" 2>/dev/null || true
          cp "$LAB/config/instance.json" "$EVIDENCE/instance.json" 2>/dev/null || true
          cp "$LAB/config/local.json" "$EVIDENCE/local.json" 2>/dev/null || true

          {
            echo "pre_main=$pre_main"
            echo "entered_main=$entered_main"
            echo "sdl_ready=$sdl_ready"
            echo "video_ready=$video_ready"
            echo "graphics_loaded=$graphics_loaded"
            echo "audio_stage=$audio_stage"
            echo "loop_enter=$loop_enter"
            echo "loop_returned=$loop_returned"
            echo "clean_exit=$clean_exit"
            echo "error_exit=$error_exit"
            echo "stages:"
            find "$TARGET" -maxdepth 1 -type f -name 'stage-cdogs-*' -printf '%f\n' | sort
          } | tee "$EVIDENCE/result.txt"

          python3 - "$EVIDENCE" <<'PY'
          from pathlib import Path
          import json
          import sys
          try:
              from PIL import Image, ImageStat
          except Exception as exc:
              print(f"Pillow unavailable: {exc}")
              raise SystemExit(0)
          root = Path(sys.argv[1])
          report = {}
          for image_path in sorted(root.glob("screen-*.jpg")):
              with Image.open(image_path).convert("RGB") as image:
                  stat = ImageStat.Stat(image)
                  report[image_path.name] = {
                      "size": list(image.size),
                      "mean": [round(v, 2) for v in stat.mean],
                      "stddev": [round(v, 2) for v in stat.stddev],
                      "extrema": [list(v) for v in image.getextrema()],
                  }
          (root / "screen-analysis.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

          cleanup
          trap - EXIT

          test "$pre_main" -eq 1
          test "$entered_main" -eq 1
          test "$sdl_ready" -eq 1
          test "$video_ready" -eq 1
          test "$graphics_loaded" -eq 1
          test "$audio_stage" -eq 1
          test "$loop_enter" -eq 1
          test "$loop_returned" -eq 1
          test "$error_exit" -eq 0
          test "$clean_exit" -eq 1

      - name: Upload first-light evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CDogs-FirstLight-${{ github.run_id }}
          path: build/cdogs-firstlight/evidence/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
