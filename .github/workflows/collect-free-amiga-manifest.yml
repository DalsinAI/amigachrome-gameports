name: Collect Free Amiga Game Manifest

on:
  push:
    branches:
      - research/free-amiga-games-20261012
    paths:
      - .github/workflows/collect-free-amiga-manifest.yml
  workflow_dispatch:

jobs:
  collect:
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Prepare collector
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m venv "$RUNNER_TEMP/free-amiga-manifest"
          "$RUNNER_TEMP/free-amiga-manifest/bin/pip" install --quiet requests beautifulsoup4 yt-dlp
          mkdir -p manifest

      - name: Collect YouTube, Amigos Retro Gaming and news-source links
        shell: bash
        run: |
          set -euxo pipefail
          "$RUNNER_TEMP/free-amiga-manifest/bin/python" - <<'PY'
          from __future__ import annotations

          import html
          import json
          import re
          import subprocess
          import sys
          import time
          from collections import defaultdict
          from pathlib import Path
          from urllib.parse import urlparse, urlunparse

          import requests
          from bs4 import BeautifulSoup

          OUT = Path("manifest")
          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 AmigaChrome game catalogue research"})
          START = "2026-01-01T00:00:00"
          END = "2026-10-13T00:00:00"

          def normalise(url: str) -> str:
              url = html.unescape((url or "").strip()).rstrip(".,);]>")
              if not url.startswith(("http://", "https://")):
                  return ""
              p = urlparse(url)
              host = p.netloc.lower()
              path = p.path.rstrip("/")
              # Remove common tracking/query fragments while retaining direct file URLs.
              query = p.query if any(x in host for x in ("drive.google.com", "mega.nz")) else ""
              return urlunparse(("https", host, path, "", query, ""))

          def wp_posts(site: str, label: str):
              rows = []
              for page in range(1, 100):
                  r = session.get(
                      site.rstrip("/") + "/wp-json/wp/v2/posts",
                      params={
                          "after": START, "before": END, "per_page": 100,
                          "page": page, "orderby": "date", "order": "desc",
                          "_fields": "date,link,title,content,excerpt",
                      },
                      timeout=30,
                  )
                  if r.status_code == 400 and page > 1:
                      break
                  r.raise_for_status()
                  data = r.json()
                  if not data:
                      break
                  for post in data:
                      content = post.get("content", {}).get("rendered", "")
                      soup = BeautifulSoup(content, "html.parser")
                      text = " ".join(soup.get_text(" ").split())
                      title = " ".join(BeautifulSoup(
                          post.get("title", {}).get("rendered", ""), "html.parser"
                      ).get_text(" ").split())
                      links = []
                      for a in soup.select("a[href]"):
                          url = normalise(a.get("href", ""))
                          if url:
                              links.append({"url": url, "label": " ".join(a.get_text(" ").split())})
                      rows.append({
                          "source": label,
                          "date": post.get("date", "")[:10],
                          "title": title,
                          "article": post.get("link"),
                          "text": text,
                          "links": links,
                      })
                  if page >= int(r.headers.get("X-WP-TotalPages", page)):
                      break
                  time.sleep(0.15)
              return rows

          # The user's Amiga-retro-gaming source resolves to the Amigos Retro
          # Gaming itch creator used by the 2026 Lotus DX coverage.
          creator_url = "https://amigos-retro-gaming.itch.io/"
          creator = session.get(creator_url, timeout=30)
          creator.raise_for_status()
          creator_soup = BeautifulSoup(creator.text, "html.parser")
          creator_games = []
          for a in creator_soup.select("a[href]"):
              url = normalise(a.get("href", ""))
              if not url:
                  continue
              host = urlparse(url).netloc
              path = urlparse(url).path.strip("/")
              if host == "amigos-retro-gaming.itch.io" and path:
                  creator_games.append(url)
          creator_games = sorted(set(creator_games))

          # The current 2026 roundup has timestamps and download links in its
          # description. Fetch metadata only; no video or audio is downloaded.
          video_url = "https://www.youtube.com/watch?v=IZskVmLzfp4"
          ytdlp = Path(sys.prefix) / "bin" / "yt-dlp"
          proc = subprocess.run(
              [str(ytdlp), "--skip-download", "--dump-single-json", video_url],
              stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              timeout=240, check=False,
          )
          if not proc.stdout.strip():
              raise SystemExit("yt-dlp returned no metadata: " + proc.stderr[-2000:])
          video = json.loads(proc.stdout)
          description = video.get("description") or ""
          description_urls = sorted(set(
              u for u in (normalise(x) for x in re.findall(r"https?://[^\s<>]+", description)) if u
          ))
          video_info = {
              "id": video.get("id"),
              "title": video.get("title"),
              "channel": video.get("channel") or video.get("uploader"),
              "channel_url": video.get("channel_url") or video.get("uploader_url"),
              "upload_date": video.get("upload_date"),
              "webpage_url": video.get("webpage_url"),
              "description": description,
              "chapters": video.get("chapters") or [],
              "urls": description_urls,
          }

          posts = []
          errors = []
          for site, label in (
              ("https://www.generationamiga.com", "Generation Amiga"),
              ("https://amigatronics.com", "Amigatronics"),
          ):
              try:
                  got = wp_posts(site, label)
                  posts.extend(got)
                  print(label, len(got))
              except Exception as exc:
                  errors.append({"site": site, "source": label, "error": repr(exc)})

          # Keep outbound links that can plausibly be a classic-Amiga game or
          # download source. Articles are preserved to support manual review.
          link_sources = defaultdict(list)
          article_rows = []
          amiga_terms = re.compile(r"\b(amiga|a500|a600|a1200|aga|ocs|ecs|cd32|68k|680[0-6]0)\b", re.I)
          game_terms = re.compile(r"\b(game|juego|videojuego|demo|beta|prototype|port|remake|shooter|platform|arcade|adventure|strategy|puzzle|racing|sports)\b", re.I)
          free_terms = re.compile(r"\b(free|gratis|gratuit|name[- ]your[- ]own[- ]price|pay what you want|download|descarga|itch\.io|aminet|github)\b", re.I)
          source_hosts = ("itch.io", "aminet.net", "github.com", "amigafrance.com", "drive.google.com", "mega.nz", "nightshift.cx")
          for post in posts:
              combined = post["title"] + " " + post["text"]
              if not (amiga_terms.search(combined) and game_terms.search(combined)):
                  continue
              selected = []
              for link in post["links"]:
                  host = urlparse(link["url"]).netloc.lower()
                  if host.endswith(source_hosts):
                      selected.append(link)
                      link_sources[link["url"]].append({
                          "source": post["source"], "date": post["date"],
                          "article": post["article"], "title": post["title"],
                      })
              if selected or free_terms.search(combined):
                  row = dict(post)
                  row["candidate_links"] = selected
                  article_rows.append(row)

          for url in creator_games:
              link_sources[url].append({
                  "source": "Amigos Retro Gaming", "date": "2026",
                  "article": creator_url, "title": "Amigos Retro Gaming itch catalogue",
              })
          for url in description_urls:
              host = urlparse(url).netloc.lower()
              if host.endswith(("itch.io", "aminet.net", "github.com", "amigafrance.com", "drive.google.com", "mega.nz")):
                  link_sources[url].append({
                      "source": "Just Jamie Retro Realm 2026 free-game roundup",
                      "date": (video.get("upload_date") or "")[:4],
                      "article": video_url, "title": video.get("title"),
                  })

          manifest = []
          for url, refs in sorted(link_sources.items()):
              manifest.append({"url": url, "sources": refs})

          (OUT / "video.json").write_text(json.dumps(video_info, indent=2, ensure_ascii=False), encoding="utf-8")
          (OUT / "amigos-retro-gaming.json").write_text(json.dumps({
              "creator": creator_url, "games": creator_games,
          }, indent=2, ensure_ascii=False), encoding="utf-8")
          (OUT / "articles.json").write_text(json.dumps(article_rows, indent=2, ensure_ascii=False), encoding="utf-8")
          (OUT / "source-links.json").write_text(json.dumps(manifest, indent=2, ensure_ascii=False), encoding="utf-8")
          (OUT / "errors.json").write_text(json.dumps(errors, indent=2, ensure_ascii=False), encoding="utf-8")

          md = [
              "# Free Amiga Game Source Manifest",
              "",
              f"- YouTube roundup: {video_info['title']} — {video_info['channel']}",
              f"- Amigos Retro Gaming itch projects: {len(creator_games)}",
              f"- News articles retained: {len(article_rows)}",
              f"- Unique outbound source links: {len(manifest)}",
              "",
              "## Amigos Retro Gaming",
          ]
          md += [f"- {u}" for u in creator_games] or ["- No projects found"]
          md += ["", "## 2026 roundup chapters"]
          for c in video_info["chapters"]:
              md.append(f"- {c.get('start_time', 0):.0f}s — {c.get('title', '')}")
          md += ["", "## Unique candidate source links"]
          for item in manifest:
              md.append(f"- {item['url']}")
              for ref in item["sources"]:
                  md.append(f"  - {ref['source']} — {ref['title']} — {ref['article']}")
          (OUT / "MANIFEST.md").write_text("\n".join(md) + "\n", encoding="utf-8")
          PY

      - name: Show summary
        shell: bash
        run: |
          set -euxo pipefail
          wc -c manifest/*
          sed -n '1,360p' manifest/MANIFEST.md

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: free-amiga-game-manifest-${{ github.run_id }}
          path: manifest/
          retention-days: 30
          compression-level: 6
