name: daletop ops

on:
  push:
    branches:
      - ops/daletop
    paths:
      - ops/daletop-task.txt

permissions:
  contents: read

jobs:
  ops:
    name: daletop named task
    if: github.actor == 'SacredTrees'
    runs-on: [self-hosted, daletop, amigachrome, ac090]
    timeout-minutes: 20
    env:
      STOVE: /home/da1ek/AmigaChrome/stoves/os32-gcc16/prefix
      GAMEPORTS: /home/da1ek/AmigaChrome-dev/gameports-wt

    steps:
      - name: Execute approved task
        shell: bash
        env:
          TASK: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          export PATH="$STOVE/bin:$PATH"

          echo "Runner: $(hostname) / $(whoami)"
          echo "Task: $TASK"
          echo

          case "$TASK" in
            "daletop: inspect-gameports")
              R="$GAMEPORTS"
              test -d "$R"

              echo "=== repository ==="
              git -C "$R" status --short --branch
              git -C "$R" log --oneline --decorate -8
              echo

              echo "=== active game-port processes ==="
              ps -eo pid,etime,pcpu,pmem,args |                 grep -E "(gameports-wt|m68k-amigaos-gcc|m68k-amigaos-g\+\+)" |                 grep -v grep || true
              echo

              echo "=== revival build log tail ==="
              if [ -f "$R/build/revival-local-build.log" ]; then
                tail -120 "$R/build/revival-local-build.log"
              else
                echo "NO revival-local-build.log"
              fi
              echo

              echo "=== known target binaries ==="
              find "$R/build" -type f \
                \( -name chocolate-doom -o -name OpenJazz -o -name SDLPoP \
                   -o -name nxengine-evo -o -name cdogs-sdl -o -name uqm \) \
                -print 2>/dev/null | sort | while read -r f; do
                  file "$f"
                  sha256sum "$f"
                done
              echo

              echo "=== prepared sources ==="
              if [ -f "$R/build/game-ports/PREPARED.json" ]; then
                python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/home/da1ek/AmigaChrome-dev/gameports-wt/build/game-ports/PREPARED.json")
          d=json.loads(p.read_text())
          for k,v in sorted(d.get("ports",{}).items()):
              src=v.get("source",{})
              print(k, src.get("commit") or src.get("sha256"), v.get("path"))
          PY
              else
                echo "NO PREPARED.json"
              fi
              ;;

            "daletop: inspect-uqm-cdogs")
              R="$GAMEPORTS"
              U="$R/build/game-ports/sources/uqm/uqm-0.8.0"
              C="$R/build/game-ports/sources/cdogs-sdl"

              echo "=== UQM port.h ==="
              sed -n '105,145p' "$U/src/port.h"
              echo
              echo "=== UQM uioport.h ==="
              sed -n '90,135p' "$U/src/libs/uio/uioport.h"
              echo
              echo "=== UQM build script ==="
              sed -n '1,260p' "$R/ports/uqm/build-amigaos3.sh"
              echo
              echo "=== toolchain NAME_MAX macros ==="
              "$STOVE/bin/m68k-amigaos-gcc" -dM -E -x c /dev/null |                 grep -E '(_POSIX_NAME_MAX|NAME_MAX|PATH_MAX)' || true
              echo
              echo "=== C-Dogs build script ==="
              sed -n '1,260p' "$R/ports/cdogs-sdl/build-amigaos3.sh"
              echo
              echo "=== C-Dogs likely runtime data ==="
              find "$C" -maxdepth 3 -type d \
                \( -name dogfights -o -name missions -o -name graphics -o -name music -o -name sounds -o -name data \) \
                -print 2>/dev/null | sort
              echo
              echo "=== C-Dogs binary ==="
              file "$R/build/os3/cdogs/src/cdogs-sdl"
              sha256sum "$R/build/os3/cdogs/src/cdogs-sdl"
              ;;

            *)
              echo "REFUSED: task is not on the approved allow-list: $TASK" >&2
              exit 64
              ;;
          esac
