name: daletop ops

on:
  push:
    branches:
      - ops/daletop
    paths:
      - ops/daletop-task.txt

permissions:
  contents: read

jobs:
  ops:
    name: daletop named task
    if: github.actor == 'SacredTrees'
    runs-on: [self-hosted, daletop, amigachrome, ac090]
    timeout-minutes: 30
    env:
      STOVE_ROOT: /home/da1ek/AmigaChrome/stoves/os32-gcc16
      STOVE_PREFIX: /home/da1ek/AmigaChrome/stoves/os32-gcc16/prefix
      GAMEPORTS: /home/da1ek/AmigaChrome-dev/gameports-wt

    steps:
      - name: Execute approved task
        shell: bash
        env:
          TASK: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          export PATH="$STOVE_PREFIX/bin:$PATH"
          echo "Runner: $(hostname) / $(whoami)"
          echo "Task: $TASK"
          echo

          case "$TASK" in
            "daletop: inspect-gameports")
              R="$GAMEPORTS"
              echo "=== repository ==="
              git -C "$R" status --short --branch
              echo
              echo "=== revival log ==="
              tail -100 "$R/build/revival-local-build.log" 2>/dev/null || true
              echo
              echo "=== binaries ==="
              find "$R/build" -type f \
                \( -name chocolate-doom -o -name OpenJazz -o -name SDLPoP \
                   -o -name nxengine-evo -o -name cdogs-sdl -o -name uqm \) \
                -print 2>/dev/null | sort | while read -r file; do
                  file "$file"
                  sha256sum "$file"
                done
              ;;

            "daletop: package-cdogs")
              R="$GAMEPORTS"
              C="$R/build/game-ports/sources/cdogs-sdl"
              BIN="$R/build/os3/cdogs/src/cdogs-sdl"
              OUT="$R/build/release/cdogs-sdl"

              test -f "$BIN"
              rm -rf "$OUT"
              mkdir -p "$OUT/C-Dogs"
              cp "$BIN" "$OUT/C-Dogs/CDogs"

              for dir in data dogfights missions graphics music sounds; do
                if [ -e "$C/$dir" ]; then
                  cp -a "$C/$dir" "$OUT/C-Dogs/"
                fi
              done

              for doc in LICENSE LICENSE.md COPYING COPYING.txt README README.md CHANGELOG CHANGELOG.md; do
                if [ -f "$C/$doc" ]; then
                  cp "$C/$doc" "$OUT/C-Dogs/"
                fi
              done

              printf '%s\n' \
                'C-Dogs SDL for OpenUp / AmigaChrome' \
                'Target: AmigaOS 3.x, 68040 + FPU' \
                'Graphics/input/audio: Open platform SDL2 path' \
                'Runtime data: bundled upstream redistributable data from pinned source' \
                'Status: COMPILED + PACKAGE STAGED; runtime qualification required' \
                > "$OUT/C-Dogs/OPENUP-RELEASE.txt"

              (
                cd "$OUT"
                find C-Dogs -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
              )

              file "$OUT/C-Dogs/CDogs"
              sha256sum "$OUT/C-Dogs/CDogs"
              du -sh "$OUT/C-Dogs"
              echo "CDOGS_PACKAGE_PASS"
              ;;

            "daletop: inspect-uqm-strcasecmp")
              R="$GAMEPORTS"
              U="$R/build/game-ports/sources/uqm/uqm-0.8.0"
              SYS="$STOVE_PREFIX/m68k-amigaos"

              echo "=== UQM port.h compare logic ==="
              grep -n -A24 -B14 -E 'strcasecmp|stricmp' "$U/src/port.h" | head -160 || true
              echo
              echo "=== declarations in sysroot ==="
              grep -RIn --include='*.h' -E 'strcasecmp|stricmp|strncasecmp|strnicmp' \
                "$SYS/include" "$SYS/ndk-include" 2>/dev/null | head -160 || true
              echo
              echo "=== exported symbols ==="
              for archive in "$SYS"/lib/*.a "$SYS"/libnix/lib/*.a; do
                [ -f "$archive" ] || continue
                hits=$("$STOVE_PREFIX/bin/m68k-amigaos-nm" -g "$archive" 2>/dev/null | \
                  grep -E '(_?strcasecmp|_?stricmp|_?strncasecmp|_?strnicmp)' || true)
                if [ -n "$hits" ]; then
                  echo "IN $archive"
                  printf '%s\n' "$hits"
                fi
              done
              echo
              echo "=== UQM configure probe ==="
              grep -n -A24 -B12 -E 'strcasecmp|stricmp' "$U/build/unix/config_proginfo_host" | head -180 || true
              ;;

            "daletop: probe-uqm-compare-link")
              TMP=$(mktemp -d)
              trap 'rm -rf "$TMP"' EXIT
              SYS="$STOVE_PREFIX/m68k-amigaos"

              cat > "$TMP/test.c" <<'EOF'
          extern int strcasecmp(const char *, const char *);
          extern int stricmp(const char *, const char *);
          int main(void) {
              return strcasecmp("OpenUp","openup") || stricmp("Amiga","amiga");
          }
          EOF

              echo "=== default link ==="
              if "$STOVE_PREFIX/bin/m68k-amigaos-gcc" -noixemul -m68040 -m68881 "$TMP/test.c" -o "$TMP/test-default"; then
                file "$TMP/test-default"
                echo "DEFAULT_COMPARE_LINK_PASS"
              else
                echo "DEFAULT_COMPARE_LINK_FAIL"
              fi

              echo
              echo "=== explicit libc ==="
              if "$STOVE_PREFIX/bin/m68k-amigaos-gcc" -noixemul -m68040 -m68881 "$TMP/test.c" -L"$SYS/lib" -lc -o "$TMP/test-libc"; then
                file "$TMP/test-libc"
                echo "LIBC_COMPARE_LINK_PASS"
              else
                echo "LIBC_COMPARE_LINK_FAIL"
              fi

              echo
              echo "=== explicit libnix ==="
              if "$STOVE_PREFIX/bin/m68k-amigaos-gcc" -noixemul -m68040 -m68881 "$TMP/test.c" -L"$SYS/libnix/lib" -lnix -o "$TMP/test-libnix"; then
                file "$TMP/test-libnix"
                echo "LIBNIX_COMPARE_LINK_PASS"
              else
                echo "LIBNIX_COMPARE_LINK_FAIL"
              fi

              echo
              echo "=== UQM configure fatal ==="
              U="$GAMEPORTS/build/game-ports/sources/uqm/uqm-0.8.0"
              grep -RIn -A12 -B12 "neither strcasecmp" "$U/build" "$U/src" | head -120 || true
              ;;

            "daletop: inspect-uqm-probe-engine")
              U="$GAMEPORTS/build/game-ports/sources/uqm/uqm-0.8.0"
              echo "=== define_have_symbol implementation ==="
              grep -RIn -A70 -B20 "define_have_symbol()" "$U/build" | head -220 || true
              echo
              echo "=== have_symbol implementation ==="
              grep -RIn -A50 -B20 "have_symbol()" "$U/build" | head -180 || true
              echo
              echo "=== probe source generation ==="
              grep -RIn -A60 -B20 "SYMBOL_.*_EXTRA" "$U/build/unix" | head -240 || true
              ;;

            "daletop: fix-uqm-probe-rebuild")
              R="$GAMEPORTS"
              B="$R/ports/uqm/build-amigaos3.sh"

              echo "=== patch UQM Amiga configure probes ==="
              python3 - "$B" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          anchor="""s=s.replace('LIB_zlib_LDFLAGS="-lz"',
          '''LIB_zlib_LDFLAGS="-L$UQM_DEPS/lib -lz"''')
          """
          addition="""s=s.replace('SYMBOL_strcasecmp_EXTRA="#include <strings.h>"',
          '''SYMBOL_strcasecmp_EXTRA="extern int strcasecmp(const char *, const char *);"''')
          s=s.replace('SYMBOL_stricmp_EXTRA="#include <string.h>"',
          '''SYMBOL_stricmp_EXTRA="extern int stricmp(const char *, const char *);"''')
          """
          if 'extern int strcasecmp(const char *, const char *);' not in s:
              if anchor not in s:
                  raise SystemExit("config_proginfo_host patch anchor not found")
              s=s.replace(anchor, anchor + addition, 1)
              p.write_text(s)
          print("probe declarations present")
          PY

              sh -n "$B"
              grep -n -A10 -B6 'SYMBOL_strcasecmp_EXTRA' "$B" || true

              echo
              echo "=== rebuild UQM, local prepared source only ==="
              sh "$B"

              echo
              echo "=== UQM target executables ==="
              find "$R/build/os3/uqm" -type f -name 'uqm*' -perm -111 -print | sort | while read -r exe; do
                file "$exe"
                sha256sum "$exe"
              done
              echo "UQM_REBUILD_PASS"
              ;;

            "daletop: inspect-cdogs-lab")
              LAB=/home/da1ek/AmigaChrome-dev/openup070lab
              PKG="$GAMEPORTS/build/release/cdogs-sdl/C-Dogs"

              echo "=== C-Dogs package ==="
              test -d "$PKG"
              du -sh "$PKG"
              find "$PKG" -maxdepth 2 -type f -printf '%P\n' | sort | head -120
              echo

              echo "=== lab directory ==="
              if [ -d "$LAB" ]; then
                find "$LAB" -maxdepth 2 -type f -printf '%P\n' | sort | head -220
              else
                echo "NO openup070lab"
              fi
              echo

              echo "=== run helper ==="
              [ ! -f "$LAB/run.sh" ] || sed -n '1,260p' "$LAB/run.sh"
              echo
              echo "=== drive helper ==="
              [ ! -f "$LAB/drive.py" ] || sed -n '1,340p' "$LAB/drive.py"
              echo

              echo "=== instances ==="
              find "$LAB" -maxdepth 2 -type d -name 'Instance-*' -print 2>/dev/null | sort
              echo

              echo "=== active lab listeners ==="
              ss -ltnp 2>/dev/null | grep -E ':(8938|8939|8788|8790)[[:space:]]' || true
              ;;

            "daletop: inspect-uqm-generated-and-cdogs-layout")
              R="$GAMEPORTS"
              W="$R/build/os3/uqm/work"
              echo "=== generated UQM probe definitions ==="
              if [ -f "$W/build/unix/config_proginfo_host" ]; then
                sed -n '333,348p' "$W/build/unix/config_proginfo_host"
              else
                echo "NO generated config_proginfo_host"
              fi
              echo
              echo "=== UQM temp/config artifacts ==="
              find "$R/build/os3/uqm" -maxdepth 4 -type f \
                \( -name '*config*log*' -o -name 'config.state' -o -name '*.err' -o -name '*.out' \) \
                -print 2>/dev/null | sort | head -120
              echo
              echo "=== active lab command lines ==="
              ps -eo pid,args | grep -E '(amigachrome_host.py|native_bridge.py)' | grep -v grep || true
              echo
              echo "=== instance sizes ==="
              du -sh /home/da1ek/AmigaChrome-dev/openup070lab/Instance-U \
                     /home/da1ek/AmigaChrome-dev/openup070lab/Instance-Neverball 2>/dev/null || true
              echo
              echo "=== Instance-U devices ==="
              find /home/da1ek/AmigaChrome-dev/openup070lab/Instance-U/devices -maxdepth 3 -type d -print 2>/dev/null | sort | head -160
              echo
              echo "=== Neverball staged guest paths ==="
              find /home/da1ek/AmigaChrome-dev/openup070lab/Instance-Neverball/devices -maxdepth 5 \
                \( -type f -o -type d \) -iname '*Neverball*' -print 2>/dev/null | head -120
              ;;

            "daletop: inspect-neverball-launch")
              N=/home/da1ek/AmigaChrome-dev/openup070lab/Instance-Neverball/devices/harddisks/DH1/Neverball
              echo "=== Neverball start scripts ==="
              find "$N" -maxdepth 1 -type f -name 'start-*' -print | sort
              for script in "$N"/start-*; do
                [ -f "$script" ] || continue
                echo "--- $script ---"
                sed -n '1,120p' "$script"
              done
              echo
              echo "=== candidate C-Dogs ports ==="
              ss -ltnp 2>/dev/null | grep -E ':(8958|8959)[[:space:]]' || echo "8958/8959 free"
              ;;

            "daletop: setup-cdogs-lab")
              LAB=/home/da1ek/AmigaChrome-dev/openup070lab
              BASE="$LAB/Instance-U"
              I="$LAB/Instance-CDogs"
              PKG="$GAMEPORTS/build/release/cdogs-sdl/C-Dogs"

              if ss -ltn 2>/dev/null | grep -Eq ':(8958|8959)[[:space:]]'; then
                echo "REFUSED: 8958/8959 already in use" >&2
                exit 70
              fi

              echo "=== clone pristine instance ==="
              rm -rf "$I"
              cp -a --reflink=auto "$BASE" "$I"

              echo "=== stage C-Dogs ==="
              rm -rf "$I/devices/harddisks/DH1/C-Dogs"
              cp -a "$PKG" "$I/devices/harddisks/DH1/C-Dogs"
              cat > "$I/devices/harddisks/DH1/C-Dogs/start-cdogs" <<'EOF'
          Stack 262144
          CD DH1:C-Dogs
          CDogs >DH1:C-Dogs/cdogs.log
          EOF

              echo "=== start isolated lab ==="
              mkdir -p "$I/logs"
              setsid nohup python3 /home/da1ek/AmigaChrome/host/amigachrome_host.py \
                --root /home/da1ek/AmigaChrome \
                --instance-root "$I" \
                --storage "$I/devices" \
                --port 8959 >"$I/logs/host-cdogs.log" 2>&1 < /dev/null &
              HPID=$!
              echo "$HPID" > "$LAB/cdogs-host.pid"
              sleep 2
              setsid nohup python3 /home/da1ek/AmigaChrome/host/native/native_bridge.py \
                --instance-root "$I" \
                --port 8958 \
                --host-port 8959 \
                --z3 256 \
                --host-pid "$HPID" >"$I/logs/bridge-cdogs.log" 2>&1 < /dev/null &
              BPID=$!
              echo "$BPID" > "$LAB/cdogs-bridge.pid"

              echo "host=$HPID bridge=$BPID"
              sleep 12

              echo "=== prelaunch screenshot ==="
              LABPORT=8958 python3 "$LAB/drive.py" shot cdogs-prelaunch || true

              echo "=== launch via Workbench Execute ==="
              LABPORT=8958 python3 "$LAB/drive.py" key ramiga+e
              sleep 1
              LABPORT=8958 python3 "$LAB/drive.py" type "DH0:C/Execute DH1:C-Dogs/start-cdogs"
              LABPORT=8958 python3 "$LAB/drive.py" key ret
              sleep 20

              echo "=== postlaunch screenshot ==="
              LABPORT=8958 python3 "$LAB/drive.py" shot cdogs-firstlight || true

              echo "=== process/listener state ==="
              ss -ltnp 2>/dev/null | grep -E ':(8958|8959)[[:space:]]' || true
              echo
              echo "=== C-Dogs guest log ==="
              cat "$I/devices/harddisks/DH1/C-Dogs/cdogs.log" 2>/dev/null || echo "NO cdogs.log"
              echo
              echo "=== host log tail ==="
              tail -120 "$I/logs/host-cdogs.log" 2>/dev/null || true
              echo
              echo "=== bridge log tail ==="
              tail -120 "$I/logs/bridge-cdogs.log" 2>/dev/null || true
              ;;

            "daletop: emit-cdogs-screenshot")
              SRC=/home/da1ek/AmigaChrome-dev/openup070lab/shots/cdogs-firstlight.png
              TMP=$(mktemp --suffix=.jpg)
              trap 'rm -f "$TMP"' EXIT
              python3 - "$SRC" "$TMP" <<'PY'
          from PIL import Image
          import sys
          im=Image.open(sys.argv[1]).convert("RGB")
          im.thumbnail((320,180))
          im.save(sys.argv[2],"JPEG",quality=45,optimize=True)
          print("SHOT_SIZE", im.size)
          PY
              echo "CDOGS_SCREENSHOT_BASE64_BEGIN"
              base64 -w0 "$TMP"
              echo
              echo "CDOGS_SCREENSHOT_BASE64_END"
              ;;

            "daletop: run-cdogs-firstlight")
              LAB=/home/da1ek/AmigaChrome-dev/openup070lab
              I="$LAB/Instance-CDogs"

              if ss -ltn 2>/dev/null | grep -Eq ':(8958|8959)[[:space:]]'; then
                echo "REFUSED: 8958/8959 already in use" >&2
                exit 70
              fi

              echo "=== start C-Dogs lab ==="
              mkdir -p "$I/logs"
              RUNNER_TRACKING_ID= setsid nohup python3 /home/da1ek/AmigaChrome/host/amigachrome_host.py \
                --root /home/da1ek/AmigaChrome \
                --instance-root "$I" \
                --storage "$I/devices" \
                --port 8959 >"$I/logs/host-cdogs2.log" 2>&1 < /dev/null &
              HPID=$!
              sleep 2
              RUNNER_TRACKING_ID= setsid nohup python3 /home/da1ek/AmigaChrome/host/native/native_bridge.py \
                --instance-root "$I" \
                --port 8958 \
                --host-port 8959 \
                --z3 256 \
                --host-pid "$HPID" >"$I/logs/bridge-cdogs2.log" 2>&1 < /dev/null &
              BPID=$!
              echo "host=$HPID bridge=$BPID"
              sleep 12

              echo "=== dismiss OpenUp Setup: Later ==="
              LABPORT=8958 python3 "$LAB/drive.py" click 1050 570
              sleep 3
              LABPORT=8958 python3 "$LAB/drive.py" shot cdogs-after-later || true

              echo "=== launch C-Dogs ==="
              LABPORT=8958 python3 "$LAB/drive.py" key ramiga+e
              sleep 1
              LABPORT=8958 python3 "$LAB/drive.py" type "DH0:C/Execute DH1:C-Dogs/start-cdogs"
              LABPORT=8958 python3 "$LAB/drive.py" key ret
              sleep 25
              LABPORT=8958 python3 "$LAB/drive.py" shot cdogs-firstlight2 || true

              echo "=== guest file activity ==="
              ls -l "$I/devices/harddisks/DH1/C-Dogs/cdogs.log" 2>/dev/null || true
              cat "$I/devices/harddisks/DH1/C-Dogs/cdogs.log" 2>/dev/null || true
              echo
              echo "=== C-Dogs storage hits ==="
              grep -E 'C-Dogs|CDogs|SDL|opengpu|OpenInput|AHI' "$I/logs/host-cdogs2.log" | tail -160 || true
              echo
              echo "=== bridge tail ==="
              tail -80 "$I/logs/bridge-cdogs2.log" || true

              kill "$BPID" 2>/dev/null || true
              sleep 2
              kill "$HPID" 2>/dev/null || true
              echo "CDOGS_FIRSTLIGHT_ATTEMPT_COMPLETE"
              ;;

            "daletop: fix-uqm-detect-rebuild")
              R="$GAMEPORTS"
              B="$R/ports/uqm/build-amigaos3.sh"
              TMP=$(mktemp -d)
              trap 'rm -rf "$TMP"' EXIT

              echo "=== prove toolchain symbols ==="
              cat > "$TMP/strcasecmp.c" <<'EOF'
          extern int strcasecmp(const char *, const char *);
          int main(void) { return strcasecmp("OpenUp","openup"); }
          EOF
              "$STOVE_PREFIX/bin/m68k-amigaos-gcc" -noixemul -m68040 -m68881 \
                "$TMP/strcasecmp.c" -o "$TMP/strcasecmp"
              file "$TMP/strcasecmp"

              cat > "$TMP/stricmp.c" <<'EOF'
          extern int stricmp(const char *, const char *);
          int main(void) { return stricmp("Amiga","amiga"); }
          EOF
              "$STOVE_PREFIX/bin/m68k-amigaos-gcc" -noixemul -m68040 -m68881 \
                "$TMP/stricmp.c" -o "$TMP/stricmp"
              file "$TMP/stricmp"
              echo "UQM_COMPARE_SYMBOLS_LINK_PASS"

              echo
              echo "=== teach UQM cross-probe verified result ==="
              python3 - "$B" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          needle="""s=s.replace('SYMBOL_stricmp_EXTRA="#include <string.h>"',
          '''SYMBOL_stricmp_EXTRA="extern int stricmp(const char *, const char *);"''')
          """
          addition="""s=s.replace('SYMBOL_strcasecmp_DEFNAME="HAVE_STRCASECMP_UQM"',
          '''SYMBOL_strcasecmp_DEFNAME="HAVE_STRCASECMP_UQM"
          SYMBOL_strcasecmp_DETECT="true"''')
          s=s.replace('SYMBOL_stricmp_EXTRA="extern int stricmp(const char *, const char *);"',
          '''SYMBOL_stricmp_EXTRA="extern int stricmp(const char *, const char *);"
          SYMBOL_stricmp_DETECT="true"''')
          """
          if 'SYMBOL_strcasecmp_DETECT="true"' not in s:
              if needle not in s:
                  raise SystemExit("UQM probe patch anchor not found")
              s=s.replace(needle, needle + addition, 1)
              p.write_text(s)
          print("verified cross-probe override present")
          PY
              sh -n "$B"

              echo
              echo "=== rebuild UQM from prepared local source ==="
              sh "$B"

              echo
              echo "=== UQM target executables ==="
              find "$R/build/os3/uqm" -type f -name 'uqm*' -perm -111 -print | sort | while read -r exe; do
                file "$exe"
                sha256sum "$exe"
              done
              echo "UQM_REBUILD_PASS"
              ;;

            "daletop: rebuild-uqm-correct-stove")
              R="$GAMEPORTS"
              B="$R/ports/uqm/build-amigaos3.sh"
              ROOT="$STOVE_ROOT"

              echo "=== UQM build with correct stove root ==="
              echo "STOVE_ROOT=$ROOT"
              test -x "$ROOT/prefix/bin/m68k-amigaos-gcc"
              "$ROOT/prefix/bin/m68k-amigaos-gcc" --version | head -1

              STOVE="$ROOT" sh "$B"

              echo
              echo "=== UQM target executables ==="
              found=0
              while IFS= read -r exe; do
                found=1
                file "$exe"
                sha256sum "$exe"
              done < <(find "$R/build/os3/uqm" -type f -name 'uqm*' -perm -111 -print | sort)
              if [ "$found" -eq 0 ]; then
                echo "NO_UQM_EXECUTABLE"
                exit 22
              fi
              echo "UQM_REBUILD_PASS"
              ;;

            "daletop: repair-uqm-uio-patch")
              R="$GAMEPORTS"
              B="$R/ports/uqm/build-amigaos3.sh"

              echo "=== current portability block ==="
              grep -n -A70 -B8 'libnix has readdir' "$B" || true

              python3 - "$B" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()

          start=s.index("# libnix has readdir() but not readdir_r(), and does not expose _POSIX_NAME_MAX.")
          end=s.index('ln -sf "$P/bin/m68k-amigaos-gcc" "$BUILD/tools/gcc"', start)

          block=r'''# libnix has readdir() but not readdir_r(), and does not expose _POSIX_NAME_MAX.
          python3 - "$SC2/src/port.h" "$SC2/src/libs/uio/uioport.h" "$SC2/src/libs/uio/stdio/stdio.c" <<'PY_UQM_PORT'
          from pathlib import Path
          import sys

          # General UQM portability header.
          p = Path(sys.argv[1])
          t = p.read_text()
          t = t.replace(
              '#\tifndef NAME_MAX\n#\t\tdefine NAME_MAX _POSIX_NAME_MAX\n#\tendif',
              '#\tifndef NAME_MAX\n'
              '#\t\tif defined(__amigaos__)\n'
              '#\t\t\tdefine NAME_MAX 255\n'
              '#\t\telse\n'
              '#\t\t\tdefine NAME_MAX _POSIX_NAME_MAX\n'
              '#\t\tendif\n'
              '#\tendif',
              1,
          )
          p.write_text(t)

          # UIO has its own portability header with the same NAME_MAX assumption.
          p = Path(sys.argv[2])
          t = p.read_text()
          t = t.replace(
              '#\tifndef NAME_MAX\n#\t\tdefine NAME_MAX _POSIX_NAME_MAX\n#\tendif',
              '#\tifndef NAME_MAX\n'
              '#\t\tif defined(__amigaos__)\n'
              '#\t\t\tdefine NAME_MAX 255\n'
              '#\t\telse\n'
              '#\t\t\tdefine NAME_MAX _POSIX_NAME_MAX\n'
              '#\t\tendif\n'
              '#\tendif',
              1,
          )
          p.write_text(t)

          # libnix provides readdir(), not readdir_r().
          p = Path(sys.argv[3])
          t = p.read_text()
          t = t.replace(
              '\tresult = stdio_EntriesIterator_new(dirHandle);\n'
              '\tresult->status = readdir_r(dirHandle, result->direntBuffer,\n'
              '\t\t\t&result->entry);\n',
              '\tresult = stdio_EntriesIterator_new(dirHandle);\n'
              '#ifdef __amigaos__\n'
              '\tresult->entry = readdir(dirHandle);\n'
              '\tresult->status = 0;\n'
              '#else\n'
              '\tresult->status = readdir_r(dirHandle, result->direntBuffer,\n'
              '\t\t\t&result->entry);\n'
              '#endif\n',
              1,
          )
          t = t.replace(
