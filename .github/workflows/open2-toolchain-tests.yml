name: Open2 toolchain selection

on:
  push:
    paths:
      - 'toolchain/**'
      - 'scripts/stage_open2_stove.py'
      - 'tests/**'
      - '.github/workflows/open2-toolchain-tests.yml'
  pull_request:
    paths:
      - 'toolchain/**'
      - 'scripts/stage_open2_stove.py'
      - 'tests/**'
      - '.github/workflows/open2-toolchain-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selection-and-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check stove selection and archive isolation with local fixtures
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python3 -m py_compile scripts/stage_open2_stove.py tests/test_open2_staging.py tests/test_toolchain_selection.py
      - name: Check whitespace
        run: git diff --check
