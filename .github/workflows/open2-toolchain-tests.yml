name: Open2 toolchain selection

on:
  push:
    paths:
      - 'PORT_BACKLOG.md'
      - 'README.md'
      - 'docs/SDL3_PORT_REVIEW_20261024.md'
      - 'scripts/build_sdl3_port.py'
      - 'scripts/verify_gameport_stove.py'
      - 'toolchain/**'
      - 'ports/**'
      - 'scripts/stage_open2_stove.py'
      - 'scripts/port_dependencies.py'
      - 'tests/**'
      - '.github/workflows/open2-toolchain-tests.yml'
  pull_request:
    paths:
      - 'PORT_BACKLOG.md'
      - 'README.md'
      - 'docs/SDL3_PORT_REVIEW_20261024.md'
      - 'scripts/build_sdl3_port.py'
      - 'scripts/verify_gameport_stove.py'
      - 'toolchain/**'
      - 'ports/**'
      - 'scripts/stage_open2_stove.py'
      - 'scripts/port_dependencies.py'
      - 'tests/**'
      - '.github/workflows/open2-toolchain-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selection-and-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check stove selection and archive isolation with local fixtures
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python3 -m py_compile scripts/stage_open2_stove.py scripts/port_dependencies.py tests/test_open2_staging.py tests/test_toolchain_selection.py
      - name: Check committed change whitespace
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE" && -n "$PR_HEAD" ]]; then
            git diff --check "$PR_BASE...$PR_HEAD"
          elif [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$PUSH_BEFORE" HEAD
          else
            git diff --check origin/main...HEAD
          fi
