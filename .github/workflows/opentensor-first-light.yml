name: OpenTensor Beyond First Light

on:
  push:
    branches:
      - build/opentensor-first-light-20261012
    paths:
      - .github/workflows/opentensor-first-light.yml
  workflow_dispatch:

concurrency:
  group: opentensor-beyond-first-light
  cancel-in-progress: true

jobs:
  build:
    name: Build and tour the Mesa AHI OpenRTG demo
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Checkout OpenTensor source
        uses: actions/checkout@v4
        with:
          repository: DalsinAI/openamigartg
          ref: demo/opentensor-first-light-20261012
          path: build/openamigartg
          clean: true
          fetch-depth: 1

      - name: Inspect the AmigaOS SDK
        shell: bash
        run: |
          set -euxo pipefail
          STOVE="$HOME/AmigaChrome/stoves/os32-gcc16"
          "$STOVE/prefix/bin/m68k-amigaos-gcc" --version | head -1
          test -f "$STOVE/prefix/m68k-amigaos/include/GL/gl.h"
          test -f "$STOVE/prefix/m68k-amigaos/include/devices/ahi.h" || \
            test -f "$HOME/AmigaChrome/stoves/os32/prefix/m68k-amigaos/include/devices/ahi.h"
          find "$STOVE/prefix" -type f -name libGL.a -print

      - name: Build OpenTensor Beyond First Light
        shell: bash
        run: |
          set -euxo pipefail
          STOVE="$HOME/AmigaChrome/stoves/os32-gcc16" \
          OLD_STOVE="$HOME/AmigaChrome/stoves/os32" \
            sh build/openamigartg/demos/opentensor/build.sh \
              "$GITHUB_WORKSPACE/build/opentensor"

      - name: Verify the Amiga package
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/build/opentensor"
          BIN="$OUT/package/OpenTensor/OpenTensor"
          ZIP="$OUT/OpenTensor-Beyond-First-Light-0.2.0.zip"
          test -s "$BIN"
          file "$BIN"
          strings "$BIN" | grep -F 'OpenTensor: Beyond First Light'
          strings "$BIN" | grep -F 'THE NUMBER BECAME THE TIMECODE'
          strings "$BIN" | grep -F 'AND IT WAS GIVEN FORM'
          strings "$BIN" | grep -F 'THE STACK IS OPEN'
          strings "$BIN" | grep -F 'MESA / AHI / OPENRTG'
          strings "$BIN" | grep -F 'OpenTensor: renderer'
          sha256sum -c "$OUT/SHA256SUMS"
          test -s "$ZIP"
          unzip -l "$ZIP"
          cat "$OUT/package/OpenTensor/BUILD-INFO.txt"

      - name: Create an Instance-32 lab and stage OpenTensor
        shell: bash
        run: |
          set -euxo pipefail
          APP="$HOME/AmigaChrome"
          LAB_ROOT="$HOME/AmigaChrome-dev/labs"
          LAB_NAME="opentensor-beyond-${GITHUB_RUN_ID}"
          LAB="$LAB_ROOT/$LAB_NAME"
          EVIDENCE="$GITHUB_WORKSPACE/build/opentensor/runtime-evidence"
          mkdir -p "$LAB_ROOT" "$EVIDENCE"
          python3 "$APP/scripts/lab_instance.py" copy Instance-32 "$LAB" --who ChatGPT
          printf '%s\n' "$LAB_NAME" > "$EVIDENCE/LAB_NAME.txt"
          printf '%s\n' "$LAB" > "$EVIDENCE/LAB_PATH.txt"

          AMIGACHROME_LABS="$LAB_ROOT" python3 - "$APP" "$LAB_NAME" <<'PY'
          import json, sys
          app, name = sys.argv[1:]
          sys.path.insert(0, app + "/scripts")
          from cradle_mcp_amiga import AmigaTools
          tools = AmigaTools(); tools.Error = RuntimeError
          print(json.dumps(tools.install_agent("lab:" + name), indent=2))
          PY

          TARGET="$LAB/devices/harddisks/DH1/OpenTensor"
          mkdir -p "$TARGET"
          cp -a "$GITHUB_WORKSPACE/build/opentensor/package/OpenTensor/." "$TARGET/"
          python3 - "$TARGET" <<'PY'
          from pathlib import Path
          import sys

          target = Path(sys.argv[1])
          scenes = [
              ("timecode", 64, 12),
              ("streams", 78, 12),
              ("form", 96, 14),
              ("breakout", 114, 14),
              ("beyond", 130, 12),
              ("stack", 152, 11),
          ]
          for name, start, seconds in scenes:
              text = (
                  "FailAt 21\n"
                  "Stack 1000000\n"
                  "CD DH1:OpenTensor\n"
                  f'Echo "OPENTENSOR {name}: starting" >OpenTensor-{name}.log\n'
                  f'OpenTensor START {start} SECONDS {seconds} >>OpenTensor-{name}.log\n'
                  f'Echo "OPENTENSOR {name}: returned RC $RC" >>OpenTensor-{name}.log\n'
              )
              (target / ("Launch-" + name)).write_text(text, encoding="latin-1")
          PY
          find "$TARGET" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > "$EVIDENCE/staged-files.txt"
          sha256sum "$TARGET/OpenTensor" > "$EVIDENCE/staged-sha256.txt"

      - name: Tour Act II through the Cradle MCP
        shell: bash
        run: |
          set -euxo pipefail
          APP="$HOME/AmigaChrome"
          LAB_ROOT="$HOME/AmigaChrome-dev/labs"
          EVIDENCE="$GITHUB_WORKSPACE/build/opentensor/runtime-evidence"
          LAB_NAME=$(cat "$EVIDENCE/LAB_NAME.txt")
          LAB="$LAB_ROOT/$LAB_NAME"
          TARGET_DIR="$LAB/devices/harddisks/DH1/OpenTensor"

          AMIGACHROME_LABS="$LAB_ROOT" python3 - "$APP" "$LAB_NAME" "$TARGET_DIR" "$EVIDENCE" <<'PY'
          import base64, json, sys, time
          from pathlib import Path

          app, name, target_dir_s, evidence_s = sys.argv[1:]
          target_dir = Path(target_dir_s)
          evidence = Path(evidence_s)
          sys.path.insert(0, app + "/scripts")
          from cradle_mcp_amiga import AmigaTools

          tools = AmigaTools(); tools.Error = RuntimeError
          target = "lab:" + name
          scenes = [
              ("timecode", 4.0),
              ("streams", 4.0),
              ("form", 8.0),
              ("breakout", 5.0),
              ("beyond", 5.0),
              ("stack", 4.0),
          ]

          print(json.dumps(tools.lab(
              "start", name, who="ChatGPT",
              purpose="OpenTensor Beyond First Light scene tour"
          ), indent=2))

          for attempt in range(50):
              try:
                  result = tools.amiga_run(target, "Version\nAvail", timeout=8)
                  print(json.dumps(result, indent=2))
                  if result.get("finished") and "Kickstart" in result.get("output", ""):
                      break
              except Exception as exc:
                  print("agent wait", attempt, repr(exc))
              time.sleep(3)
          else:
              raise SystemExit("OpenTensor lab agent did not become ready")

          for scene, capture_after in scenes:
              log = target_dir / f"OpenTensor-{scene}.log"
              if log.exists():
                  log.unlink()
              result = tools.amiga_run(
                  target,
                  f"Run >NIL: <NIL: Execute DH1:OpenTensor/Launch-{scene}\nWait 1",
                  timeout=15,
              )
              print(scene, json.dumps(result, indent=2))
              time.sleep(capture_after)

              shot = tools.instance_screenshot(target, "rtg", 50)
              image = shot["_content"][0]
              png = evidence / f"opentensor-{scene}.png"
              png.write_bytes(base64.b64decode(image["data"]))
              print(scene, json.dumps({k: v for k, v in shot.items() if k != "_content"}, indent=2))
              print(scene, "screenshot bytes", png.stat().st_size)

              text = ""
              for attempt in range(75):
                  if log.exists():
                      text = log.read_text(encoding="latin-1", errors="replace")
                      if f"OPENTENSOR {scene}: returned RC" in text:
                          break
                  time.sleep(1)
              else:
                  raise SystemExit(f"OpenTensor {scene} run did not return")
              (evidence / f"OpenTensor-{scene}.log").write_text(text, encoding="utf-8")
              print(text)
              time.sleep(1)

          final = tools.instance_screenshot(target, "rtg", 50)
          final_image = final["_content"][0]
          (evidence / "opentensor-after-tour.png").write_bytes(base64.b64decode(final_image["data"]))
          PY

      - name: Verify the Beyond First Light tour
        shell: bash
        run: |
          set -euxo pipefail
          EVIDENCE="$GITHUB_WORKSPACE/build/opentensor/runtime-evidence"
          for scene in timecode streams form breakout beyond stack; do
            PNG="$EVIDENCE/opentensor-$scene.png"
            LOG="$EVIDENCE/OpenTensor-$scene.log"
            test -s "$PNG"
            test -s "$LOG"
            test "$(stat -c %s "$PNG")" -gt 5000
            file "$PNG"
            cat "$LOG"
            grep -F 'OpenTensor: renderer ' "$LOG"
            grep -F 'driver virgl' "$LOG"
            grep -F 'AHI 44.1 kHz stereo' "$LOG"
            grep -F "OPENTENSOR $scene: returned RC 0" "$LOG"
          done
          test -s "$EVIDENCE/opentensor-after-tour.png"
          file "$EVIDENCE/opentensor-after-tour.png"
          if grep -hE 'OpenTensor: .* [1-9][0-9]* AHI underruns' "$EVIDENCE"/OpenTensor-*.log; then
            echo 'OpenTensor produced an AHI underrun during the Act II tour.' >&2
            exit 1
          fi
          sha256sum "$EVIDENCE"/*.png "$EVIDENCE"/OpenTensor-*.log \
            > "$EVIDENCE/EVIDENCE-SHA256SUMS"

      - name: Archive the disposable lab
        if: always()
        shell: bash
        run: |
          set +e
          APP="$HOME/AmigaChrome"
          LAB_ROOT="$HOME/AmigaChrome-dev/labs"
          EVIDENCE="$GITHUB_WORKSPACE/build/opentensor/runtime-evidence"
          LAB_NAME=$(cat "$EVIDENCE/LAB_NAME.txt" 2>/dev/null)
          if [ -n "$LAB_NAME" ]; then
            AMIGACHROME_LABS="$LAB_ROOT" python3 - "$APP" "$LAB_NAME" <<'PY'
          import json, sys
          app, name = sys.argv[1:]
          sys.path.insert(0, app + "/scripts")
          from cradle_mcp_amiga import AmigaTools
          tools = AmigaTools(); tools.Error = RuntimeError
          try:
              print(json.dumps(tools.lab("archive", name), indent=2))
          except Exception as exc:
              print("lab archive:", repr(exc))
          PY
          fi

      - name: Upload OpenTensor package and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenTensor-Beyond-First-Light-0.2.0-${{ github.run_id }}
          path: |
            build/opentensor/OpenTensor-Beyond-First-Light-0.2.0.zip
            build/opentensor/SHA256SUMS
            build/opentensor/package/OpenTensor/BUILD-INFO.txt
            build/opentensor/package/OpenTensor/README.txt
            build/opentensor/runtime-evidence/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
