name: Package Neverball and AstroMenace

on:
  push:
    branches:
      - package/neverball-astromenace-20261009
  workflow_dispatch:

concurrency:
  group: package-neverball-astromenace
  cancel-in-progress: true

jobs:
  package:
    name: Build and package two games
    runs-on: self-hosted
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Build and package
        shell: bash
        run: bash scripts/run_package_two.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: AC090-Neverball-AstroMenace-${{ github.run_id }}
          path: build/package-two/packages
          if-no-files-found: error
          retention-days: 90
